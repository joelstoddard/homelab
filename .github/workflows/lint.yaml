name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: make lint-sops

      # install.sh holds the operator's pin; reading it keeps one source.
      - name: Install OpenTofu
        run: |
          v=$(sed -n 's/^TOFU_VERSION="\(.*\)"$/\1/p' install.sh)
          base="https://github.com/opentofu/opentofu/releases/download/v${v}"
          curl -fsSLO "$base/tofu_${v}_linux_amd64.tar.gz"
          curl -fsSL "$base/tofu_${v}_SHA256SUMS" | grep " tofu_${v}_linux_amd64.tar.gz$" | sha256sum --check
          tar -xzf "tofu_${v}_linux_amd64.tar.gz" tofu
          sudo install -m 0755 tofu /usr/local/bin/tofu
          tofu version

      - run: make -C opentofu fmt

      # Committed state is encrypted and CI holds no passphrase; validate needs
      # only providers, so the runner's checkout drops the state first. The NUC
      # directories read ~/.ssh/id_rsa{,.pub}; a throwaway pair satisfies file().
      - name: Validate OpenTofu
        run: |
          find opentofu -name '*.tfstate*' -delete
          ssh-keygen -q -t rsa -N '' -f ~/.ssh/id_rsa
          for d in opentofu/resources/*/; do
            tofu -chdir="$d" init -backend=false -input=false >/dev/null
            tofu -chdir="$d" validate -no-color
          done

      # The same kubectl the operator runs, so its bundled kustomize matches.
      - name: Install kubectl
        run: |
          . ./versions.env
          url="https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl "$url"
          echo "$(curl -fsSL "$url.sha256")  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - run: make -C kubernetes lint-offline

      # 3.13: the operator's interpreter; 3.14 has no rpds-py wheel.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make -C ansible build lint

      # Every directory holding test_*.py, under the Ansible venv: the role
      # tests run the real task files through its ansible-playbook.
      - name: Python unit tests
        run: |
          for d in $(git ls-files '*test_*.py' | xargs -n1 dirname | sort -u); do
            ansible/.venv/bin/python -m unittest discover -s "$d" -t "$d"
          done
