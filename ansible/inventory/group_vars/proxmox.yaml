---
# Hosts in the `proxmox` group are Debian-installed (post-PXE) NUCs that
# the 03-proxmox role converts into Proxmox VE hypervisors. Only `root`
# exists on a freshly PXE-installed host; the admin user from
# group_vars/all.yaml is created later (by 02-preflights, when that
# role lands). Override here so the conversion playbook can SSH in.
ansible_user: root
