---
roles:
  - name: geerlingguy.swap
  - name: robertdebock.fail2ban
  - name: artis3n.tailscale
collections:
  - name: ansible.utils
  - name: ansible.posix
  - name: community.general
  - name: community.docker
  # The talos role seeds Cilium with the helm modules; 6.5.0 is the first
  # release that speaks Helm 4 (install.sh's HELM_VERSION).
  - name: kubernetes.core
    version: ">=6.5.0"
  - name: netbox.netbox
  - name: community.sops
  # techno-tim/k3s-ansible isn't packaged as a Galaxy collection (no galaxy.yml),
  # so `ansible-galaxy collection install` fails on it. Re-enable when the k3s
  # role lands and we've decided how to consume it (submodule, vendored, or fork).
  # - name: https://github.com/techno-tim/k3s-ansible.git
  #   type: git
  #   version: master