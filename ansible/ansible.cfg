[defaults]
# Roles live at the project root regardless of which subdirectory the
# playbook is in. Without this, playbooks/main.yaml would only look in
# playbooks/roles/ for role names.
roles_path = ./roles

# Don't prompt to accept new SSH host keys — known_hosts gets stamped
# on first connect, fine for a homelab.
host_key_checking = false

# Enable the community.sops vars plugin so SOPS-encrypted host_vars/
# and group_vars/ files (matching `*.sops.yaml`) are auto-decrypted at
# apply time. Requires `SOPS_AGE_KEY_FILE` to point at a key authorised
# by `.sops.yaml` at the repo root.
vars_plugins_enabled = host_group_vars,community.sops.sops

# Speed up SSH by reusing connections.
[ssh_connection]
pipelining = true
