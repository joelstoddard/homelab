[defaults]
# Roles live at the project root regardless of which subdirectory the
# playbook is in. Without this, playbooks/main.yaml would only look in
# playbooks/roles/ for role names.
roles_path = ./roles

# Default inventory: the inventory/ directory. Ansible merges every
# *.yaml file in there. Today that means local.yaml + (future) netbox.yaml,
# plus any operator-local pxe.yaml / main.yaml copied from the .example
# files. Per-target overrides via -i still work.
inventory = inventory/

# Don't prompt to accept new SSH host keys — known_hosts gets stamped
# on first connect, fine for a homelab.
host_key_checking = false

# Auto-discover Python on each target without warning about future pinning.
# Pinning per-host adds churn; auto_silent keeps discovery behaviour while
# silencing the future-version-of-python warning.
interpreter_python = auto_silent

[inventory]
# Skip *.yaml.example files — they're documentation/bootstrap-fallback,
# not parseable inventory. Default ignore_extensions doesn't catch them.
ignore_patterns = .+\.example$

# Speed up SSH by reusing connections.
[ssh_connection]
pipelining = true
