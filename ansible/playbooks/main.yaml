---
# The PXE-installed hosts we manage over SSH — today the Proxmox NUCs. Talos
# nodes (the Pis and the k8s VMs) have no SSH or Python and are driven over the
# Talos API by playbooks/talos.yaml instead; `all` would also sweep in every
# LXC/VM NetBox knows about.
- name: Apply post-install configuration to PXE-installed hosts.
  hosts: pxe:!talos
  gather_facts: true
  become: true
  pre_tasks:
    # NetBox inventory hostnames mirror the NetBox device-name field exactly,
    # which the homelab keeps capitalized. Linux hostnames and host_vars
    # filenames are lowercase by convention. Bridge the two by explicitly
    # loading host_vars/<lower>.sops.yaml — community.sops's vars plugin only
    # auto-loads files matching inventory_hostname verbatim.
    - name: Load SOPS-encrypted host vars (lowercase filename)
      community.sops.load_vars:
        file: "{{ host_vars_file }}"
      vars:
        host_vars_file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname | lower }}.sops.yaml"
      when: host_vars_file is file
      no_log: true
  roles:
    - 02-preflights
