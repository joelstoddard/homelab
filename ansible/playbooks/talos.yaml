---
# Talos cluster bootstrap. Runs on the operator workstation
# (connection: local) and drives nodes over the Talos API — Talos has no SSH
# or Python. See docs/talos-bootstrap.md for the flow and prerequisites.
#
# Run: make -C ansible apply-talos [CLUSTER=skylab]
#
# talos_cluster (default homelab) picks the cluster; its hosts are the talos
# group at the cluster's NetBox site (docs/design/skylab-bootstrap.md).

- name: Generate Talos cluster + per-node machine configs.
  hosts: localhost
  connection: local
  # Network facts only: the gateway comes from ansible_default_ipv4 (the prefix
  # length from NetBox; this is its fallback). config.yaml checks both fit.
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - network
  tasks:
    - name: Render configs (secrets bundle, base configs, per-node patches).
      ansible.builtin.import_role:
        name: talos
        tasks_from: config
      tags: [config]

    # A cluster whose config arrives another way (skylab's user_data) has
    # no maintenance-mode apply, so its group stays empty.
    - name: Queue the cluster's nodes for the maintenance-mode apply.
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: talos_apply_pending
        talos_cluster_name: "{{ talos_cluster_name }}"
        talos_clusterconfig_dir: "{{ talos_clusterconfig_dir }}"
      loop: "{{ talos_cluster_hosts if talos_maintenance_apply else [] }}"
      changed_when: false
      tags: [always]

- name: Apply machine configs to nodes in maintenance mode.
  hosts: talos_apply_pending
  connection: local
  gather_facts: false
  # Deterministic, legible ordering in the log. Apply order is not
  # load-bearing: etcd is bootstrapped separately (next play) and Talos
  # workers retry the API until the control plane is up, so a worker whose
  # config lands first simply waits.
  order: sorted
  tasks:
    - name: Push this node's config.
      ansible.builtin.import_role:
        name: talos
        tasks_from: apply
      tags: [apply]

# Order matters: the machine config ships no CNI, so the health wait can only
# pass after cni.yaml has seeded Cilium, and that needs the kubeconfig.
- name: Bootstrap etcd, seed the CNI, wait for health.
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Bootstrap the control plane.
      ansible.builtin.import_role:
        name: talos
        tasks_from: bootstrap
      tags: [bootstrap]

    - name: Retrieve the kubeconfig.
      ansible.builtin.import_role:
        name: talos
        tasks_from: kubeconfig
      tags: [kubeconfig]

    - name: Seed Cilium (one-shot; Flux owns it afterwards).
      ansible.builtin.import_role:
        name: talos
        tasks_from: cni
      tags: [cni]

    - name: Wait for every node to be Ready.
      ansible.builtin.import_role:
        name: talos
        tasks_from: health
      tags: [health]
