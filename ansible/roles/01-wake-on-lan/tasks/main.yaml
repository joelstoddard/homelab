---
# Ensure the host is up. A host that already answers SSH is left alone —
# waking it would do nothing, and the previous version then waited up to
# ten minutes for its boot_id to change, which made `make homelab` hang on
# every healthy host. Only a host that is down gets the magic packet, and
# then we wait for it to come online (a fresh PXE install lands here too:
# the per-host iPXE script decides install vs. local disk, not this role).
- name: Check whether the host already answers SSH.
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    timeout: 5
  delegate_to: localhost
  register: wol_ssh_probe
  ignore_errors: true

- name: Send Wake-on-LAN magic packet.
  community.general.wakeonlan:
    mac: "{{ mac_address }}"
  delegate_to: localhost
  when: wol_ssh_probe is failed

- name: Wait for the machine to come online.
  ansible.builtin.wait_for_connection:
    timeout: 600
  when: wol_ssh_probe is failed

- name: Report.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ 'already up — WOL skipped' if wol_ssh_probe is not failed else 'woken and online' }}
