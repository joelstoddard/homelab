---
- name: Restart zram swap
  # The restart runs swapoff, which pulls every stored page back into
  # uncompressed RAM. Re-tune on a quiet host — docs/design/zram-swap.md.
  ansible.builtin.systemd_service:
    name: dev-zram0.swap
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
