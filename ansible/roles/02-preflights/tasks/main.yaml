---
# OS-agnostic post-PXE lifecycle orchestrator. Generic Debian hygiene runs
# first (resolv.yaml and zram.yaml today; admin user and fail2ban planned),
# then the per-OS task libraries by group membership.

- name: Point the Debian-based hosts at Pi-hole for name resolution.
  ansible.builtin.include_tasks: resolv.yaml
  when: "'proxmox' in group_names or 'debian' in group_names"

- name: Give the hypervisors compressed in-RAM swap.
  # `apply` is load-bearing: a tag on a dynamic include selects the include
  # alone, so without it `TAGS=zram` runs nothing.
  ansible.builtin.include_tasks:
    file: zram.yaml
    apply:
      tags: [zram]
  when: "'proxmox' in group_names"
  tags: [zram]

- name: Run the proxmox-group lifecycle (debian-to-pve, cluster, api-token, monitoring-token).
  ansible.builtin.include_role:
    name: proxmox
    tasks_from: "{{ item }}"
  loop:
    - debian-to-pve
    - cluster
    - api-token
    - monitoring-token
  when: "'proxmox' in group_names"

- name: Run the alloy-group lifecycle.
  ansible.builtin.include_role:
    name: alloy
  when: "'alloy' in group_names"

# Talos is intentionally NOT dispatched here. This play SSHes into hosts
# with become; Talos nodes run no SSH daemon and no Python. The Talos
# lifecycle lives in its own local-connection play, playbooks/talos.yaml,
# which drives the `talos` role over the Talos API. See that playbook and
# ansible/roles/talos/README.md.
