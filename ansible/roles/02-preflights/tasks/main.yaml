---
# OS-agnostic post-PXE lifecycle orchestrator. Dispatches into per-OS
# task libraries by group membership. Generic Debian hygiene tasks
# (admin user, swap, fail2ban) will land here ahead of the per-OS
# dispatch in a future change.

- name: Run the proxmox-group lifecycle (debian-to-pve, cluster, api-token).
  ansible.builtin.include_role:
    name: proxmox
    tasks_from: "{{ item }}"
  loop:
    - debian-to-pve
    - cluster
    - api-token
  when: "'proxmox' in group_names"

# Talos is intentionally NOT dispatched here. This play SSHes into hosts
# with become; Talos nodes run no SSH daemon and no Python. The Talos
# lifecycle lives in its own local-connection play, playbooks/talos.yaml,
# which drives the `talos` role over the Talos API. See that playbook and
# ansible/roles/talos/README.md.
