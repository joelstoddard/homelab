---
# Push a node's machine config while it sits in Talos maintenance mode.
#
# Invoked from the `hosts: talos` play in playbooks/talos.yaml with
# connection: local — each iteration represents one node, but the talosctl
# call runs on the operator workstation and reaches the node over the API
# at its maintenance-mode IP (ansible_host, from the NetBox primary IP).
#
# Maintenance mode (no PKI yet) only accepts --insecure. Once a config is
# applied the node installs to disk and reboots into secured mode, after
# which --insecure is refused — so this task is a one-shot bootstrap step,
# not an idempotent reconciler. Post-bootstrap config changes go through
# `talosctl apply-config` with the generated talosconfig (see the role
# README); re-running this play after install will (harmlessly) fail the
# already-secured nodes, which the runbook calls out.
#
# Maintenance-mode addressing: nodes get a transient DHCP lease (no
# reservations needed — the lease is just a rendezvous address). Each node
# is found by ARP-scanning the LAN for its NetBox MAC; the machine config
# being applied pins it to its NetBox primary IP from first installed boot.
# Falls back to ansible_host when the MAC isn't seen (e.g. already
# installed and static at its NetBox IP). Override per node with
# -e talos_node_ip=<ip> --limit <host>.

- name: Scan the LAN once for maintenance-mode nodes (ARP, by MAC).
  ansible.builtin.command:
    cmd: arp-scan --localnet --retry=2
  become: true
  run_once: true
  register: talos_arp_scan
  changed_when: false
  check_mode: false

- name: "Resolve {{ inventory_hostname }}'s maintenance IP (NetBox MAC → live lease)."
  ansible.builtin.set_fact:
    talos_maintenance_ip: >-
      {{ (talos_arp_scan.stdout_lines
          | select('search', mac_address | default('') | lower)
          | map('split') | map('first') | list | first)
         | default(ansible_host, true) }}
  when: talos_node_ip is not defined

- name: "Apply Talos config to {{ inventory_hostname }} ({{ talos_node_ip | default(talos_maintenance_ip) | default(ansible_host) }})."
  ansible.builtin.command:
    cmd: >-
      {{ talosctl_bin }} apply-config --insecure
      --nodes {{ talos_node_ip | default(talos_maintenance_ip) | default(ansible_host) }}
      --file {{ talos_clusterconfig_dir }}/{{ talos_cluster_name }}-{{ inventory_hostname }}.yaml
  register: talos_apply
  changed_when: talos_apply.rc == 0
  # Surface a clearer message when the node has already left maintenance
  # mode (config previously applied) rather than dumping the raw gRPC error.
  failed_when: >-
    talos_apply.rc != 0
    and 'certificate required' not in (talos_apply.stderr | default(''))
    and 'connection refused' not in (talos_apply.stderr | default(''))

- name: "Note: {{ inventory_hostname }} is already past maintenance mode (config previously applied)."
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} no longer accepts --insecure config — it has
      already installed and rebooted. Skipping. Use `talosctl apply-config`
      with the talosconfig for changes to a running node.
  when: talos_apply.rc != 0
