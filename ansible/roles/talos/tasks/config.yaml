---
# Generate the Talos cluster secrets bundle (once) and render a fully
# patched machine config per node.
#
# Runs on the operator workstation (the playbooks/talos.yaml localhost
# play). Talos nodes have no SSH/Python, so nothing here touches a node —
# it only drives talosctl + sops locally. apply.yaml ships the rendered
# configs to nodes over the Talos API.

- name: Ensure the Talos build directory exists.
  ansible.builtin.file:
    path: "{{ talos_build_dir }}"
    state: directory
    mode: "0700"

# --- Secrets bundle: reuse if committed, else generate + persist --------
# The bundle holds the cluster CA private keys and join tokens. We keep it
# SOPS-encrypted in the repo so every re-run derives identical PKI (adding
# a node later must not rotate the cluster CA). First run generates it and
# encrypts it back; commit the result.

- name: Ensure the role files directory exists (holds the secrets bundle).
  ansible.builtin.file:
    path: "{{ talos_secrets_sops | dirname }}"
    state: directory
    mode: "0755"

- name: Check for the committed (SOPS-encrypted) secrets bundle.
  ansible.builtin.stat:
    path: "{{ talos_secrets_sops }}"
  register: talos_secrets_committed

- name: Decrypt the existing secrets bundle into the build dir.
  ansible.builtin.command:
    cmd: "{{ sops_bin }} -d {{ talos_secrets_sops }}"
  register: talos_secrets_plain
  changed_when: false
  no_log: true
  when: talos_secrets_committed.stat.exists

- name: Stage the decrypted secrets bundle for talosctl.
  ansible.builtin.copy:
    content: "{{ talos_secrets_plain.stdout }}\n"
    dest: "{{ talos_build_dir }}/secrets.yaml"
    mode: "0600"
  no_log: true
  when: talos_secrets_committed.stat.exists

- name: Generate a fresh secrets bundle (first run only).
  ansible.builtin.command:
    cmd: "{{ talosctl_bin }} gen secrets --output-file {{ talos_build_dir }}/secrets.yaml"
    creates: "{{ talos_build_dir }}/secrets.yaml"
  when: not talos_secrets_committed.stat.exists

- name: Stage the plaintext bundle at the .sops.yaml path for encryption.
  # sops picks its creation rule from the file path it operates on, and the
  # rule in .sops.yaml keys on the .sops.yaml suffix — so encrypt in place
  # at the final filename rather than via --output from build/secrets.yaml.
  ansible.builtin.copy:
    src: "{{ talos_build_dir }}/secrets.yaml"
    dest: "{{ talos_secrets_sops }}"
    mode: "0600"
    remote_src: true
  no_log: true
  when: not talos_secrets_committed.stat.exists

- name: Encrypt the secrets bundle in place.
  ansible.builtin.command:
    cmd: "{{ sops_bin }} -e -i {{ talos_secrets_sops }}"
  when: not talos_secrets_committed.stat.exists
  changed_when: true

# --- Base machine configs ----------------------------------------------
# One control-plane and one worker base, plus the operator talosconfig.
# Per-node differences (hostname, install disk, VIP) are layered on by the
# patch step below. --force lets the configs regenerate idempotently on
# re-run; the secrets bundle (above) is what keeps PKI stable.

- name: Generate base control-plane + worker machine configs.
  ansible.builtin.command:
    cmd: >-
      {{ talosctl_bin }} gen config
      {{ talos_cluster_name }} {{ talos_cluster_endpoint }}
      --with-secrets {{ talos_build_dir }}/secrets.yaml
      --kubernetes-version {{ talos_kubernetes_version | regex_replace('^v', '') }}
      --install-image {{ talos_install_image }}
      --output-types controlplane,worker,talosconfig
      --output {{ talos_build_dir }}
      --force
  changed_when: true

# --- Per-node patched configs ------------------------------------------
# Render a small per-node patch (hostname, install disk, and — for
# control-plane nodes — the shared VIP) then merge it onto the matching
# base config. The result, .talos/<host>.yaml, is what apply.yaml pushes.

- name: Render per-node config patches.
  ansible.builtin.template:
    src: "{{ 'controlplane' if (item in talos_controlplane_hosts) else 'worker' }}.patch.yaml.j2"
    dest: "{{ talos_build_dir }}/patch-{{ item }}.yaml"
    mode: "0600"
  loop: "{{ groups['talos'] | default([]) }}"

- name: Build per-node machine configs.
  ansible.builtin.command:
    cmd: >-
      {{ talosctl_bin }} machineconfig patch
      {{ talos_build_dir }}/{{ 'controlplane' if (item in talos_controlplane_hosts) else 'worker' }}.yaml
      --patch @{{ talos_build_dir }}/patch-{{ item }}.yaml
      --output {{ talos_build_dir }}/{{ item }}.yaml
  loop: "{{ groups['talos'] | default([]) }}"
  changed_when: true

- name: Report the generated per-node configs.
  ansible.builtin.debug:
    msg: >-
      Generated {{ groups['talos'] | default([]) | length }} machine configs in
      {{ talos_build_dir }} ({{ talos_controlplane_hosts | length }} control-plane,
      {{ (groups['talos'] | default([]) | length) - (talos_controlplane_hosts | length) }} worker).
