---
# Merge the cluster kubeconfig into the operator's ~/.kube/config once the
# control plane is healthy. Runs from the playbooks/talos.yaml localhost
# play after bootstrap.yaml.
#
# talosctl merges (rather than overwrites) into an existing kubeconfig, so
# other clusters' contexts are preserved; --force only overwrites this
# cluster's own entries on a re-run, keeping the step idempotent and
# non-interactive. The talosconfig (Talos API creds) stays in the
# git-ignored build dir.

- name: Resolve the bootstrap node's IP.
  ansible.builtin.set_fact:
    talos_bootstrap_ip: "{{ hostvars[talos_bootstrap_host].ansible_host }}"

- name: Ensure the kubeconfig directory exists.
  ansible.builtin.file:
    path: "{{ talos_kubeconfig_dest | dirname }}"
    state: directory
    mode: "0700"

- name: Merge the cluster kubeconfig into the operator's ~/.kube/config.
  ansible.builtin.command:
    cmd: >-
      {{ talosctl_bin }} --talosconfig {{ talos_talosconfig }}
      kubeconfig {{ talos_kubeconfig_dest }}
      --nodes {{ talos_bootstrap_ip }} --endpoints {{ talos_bootstrap_ip }}
      --force
  changed_when: true

- name: Report where the cluster credentials landed.
  ansible.builtin.debug:
    msg:
      - "kubeconfig merged into: {{ talos_kubeconfig_dest }}"
      - "talosconfig (Talos API): {{ talos_talosconfig }}"
      - "Try: kubectl --context admin@{{ talos_cluster_name }} get nodes"
