---
# Fetch the cluster kubeconfig (and confirm the talosconfig works) once
# the control plane is healthy. Runs from the playbooks/talos.yaml
# localhost play after bootstrap.yaml.
#
# Both files land in the git-ignored build dir. The runbook
# (docs/talos-bootstrap.md) covers where to copy them for day-2 use; the
# kubeconfig is the input Flux CD will later GitOps against (see
# kubernetes/).

- name: Resolve the bootstrap node's IP.
  ansible.builtin.set_fact:
    talos_bootstrap_ip: "{{ hostvars[talos_bootstrap_host].ansible_host }}"

- name: Retrieve the cluster kubeconfig.
  ansible.builtin.command:
    cmd: >-
      {{ talosctl_bin }} --talosconfig {{ talos_build_dir }}/talosconfig
      kubeconfig {{ talos_build_dir }}/kubeconfig
      --nodes {{ talos_bootstrap_ip }} --endpoints {{ talos_bootstrap_ip }}
      --force
  changed_when: true

- name: Report where the cluster credentials landed.
  ansible.builtin.debug:
    msg:
      - "kubeconfig:  {{ talos_build_dir }}/kubeconfig"
      - "talosconfig: {{ talos_build_dir }}/talosconfig"
      - "Try: KUBECONFIG={{ talos_build_dir }}/kubeconfig kubectl get nodes"
      - "Both files are git-ignored — they carry cluster admin credentials."
