---
# Reuse the committed SOPS-encrypted secret bundle, or generate and encrypt
# one on a first run. Imported by config.yaml.

- name: Check for the committed (SOPS-encrypted) secret bundle.
  ansible.builtin.stat:
    path: "{{ talos_secrets_sops }}"
  register: talos_secrets_committed

- name: Generate a fresh secret bundle at the .sops.yaml path (first run only).
  # sops picks its creation rule from the path, so this task writes the
  # plaintext there and the next one encrypts it in place.
  ansible.builtin.command:
    cmd: "{{ talosctl_bin }} gen secrets --output-file {{ talos_secrets_sops }}"
    creates: "{{ talos_secrets_sops }}"
  no_log: true

- name: Encrypt the secret bundle in place.
  ansible.builtin.command:
    cmd: "{{ sops_bin }} -e -i {{ talos_secrets_sops }}"
  changed_when: true
  when: not talos_secrets_committed.stat.exists
