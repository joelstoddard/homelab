---
# Reuse the committed SOPS-encrypted secret bundle, or generate and encrypt
# one on a first run. Imported by config.yaml.

- name: Check for the committed (SOPS-encrypted) secret bundle.
  ansible.builtin.stat:
    path: "{{ talos_secrets_sops }}"
  register: talos_secrets_committed

# The plaintext lives only in the git-ignored build dir: a failed or
# interrupted encrypt must never leave the cluster CA at a tracked path.
- name: Generate and encrypt a fresh secret bundle (first run only).
  when: not talos_secrets_committed.stat.exists
  block:
    - name: Generate the secret bundle in the build dir.
      ansible.builtin.command:
        cmd: "{{ talosctl_bin }} gen secrets --force --output-file {{ talos_secrets_plain }}"
      changed_when: true
      no_log: true

    - name: Encrypt the secret bundle to its committed path.
      # --filename-override makes sops pick the .sops.yaml creation rule of
      # the committed path, not of the build-dir input.
      ansible.builtin.command:
        cmd: >-
          {{ sops_bin }} -e
          --filename-override {{ talos_secrets_sops }}
          --output {{ talos_secrets_sops }}
          {{ talos_secrets_plain }}
      changed_when: true
  always:
    - name: Remove the plaintext secret bundle.
      ansible.builtin.file:
        path: "{{ talos_secrets_plain }}"
        state: absent
