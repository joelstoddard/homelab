---
# Talos OS-library defaults.
#
# Cluster identity lives here (not in inventory/group_vars/talos.yaml,
# as proxmox's does in group_vars/proxmox.yaml) on purpose: the Talos
# bootstrap play (playbooks/talos.yaml) generates configs and bootstraps
# etcd from a `hosts: localhost` play, because Talos nodes have no SSH or
# Python and cannot be targeted directly. localhost is not in the `talos`
# inventory group, so it never loads group_vars/talos.yaml — role
# defaults are the one place every talos play (localhost and per-node)
# reliably sees these values.
#
# Configs are rendered with `talosctl gen config` + patches: config.yaml
# resolves NetBox facts and renders the patches from NetBox/inventory
# (NetBox stays the source of truth). The literals below that NetBox can
# supply (the VIP, control-plane membership) are only fallbacks for when
# NetBox isn't populated yet.

# --- Versions -----------------------------------------------------------
# Single-sourced from repo-root versions.env (read via role_path so it
# resolves no matter which playbook includes the role). Bump the version
# THERE — never inline it here. role_path is .../ansible/roles/talos, so
# ../../../ is the repo root. config.yaml passes the first two to
# talosctl gen config; cilium_version is the chart the CNI seed installs.
talos_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^TALOS_VERSION=(.+)$', multiline=True) | first | trim }}
talos_kubernetes_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^KUBERNETES_VERSION=(.+)$', multiline=True) | first | trim }}
cilium_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^CILIUM_VERSION=(.+)$', multiline=True) | first | trim }}

# --- Cluster identity ---------------------------------------------------
talos_cluster_name: "homelab"

# Shared control-plane VIP. Talos floats this across the control-plane
# nodes, so the kube-apiserver endpoint survives any single control-plane
# node going down. SOURCED FROM NETBOX in config.yaml: the IP tagged
# `talos_vip_netbox_tag` is fetched from the NetBox API with `uri`. The
# literal below is only a fallback used when no such IP is tagged.
talos_vip: "192.168.1.100"
talos_vip_netbox_tag: "talos-vip"
talos_cluster_endpoint: "https://{{ talos_vip }}:6443"

# Node addressing is static, from NetBox: primary IP + a MAC selector, since
# Talos renames NICs (eth0→end0 on the Pis, enp* on VMs). config.yaml takes
# the prefix length from the NetBox VIP, so these renderer facts are only
# fallbacks: docs/design/talos-machine-config.md.
talos_network_prefixlen: "{{ ansible_default_ipv4.prefix | default(24) }}"
talos_network_gateway: "{{ ansible_default_ipv4.gateway | default('192.168.1.1') }}"

# --- Node roles ---------------------------------------------------------
# Control-plane membership is DERIVED FROM NETBOX in config.yaml: any host
# in groups['talos'] carrying the `talos_controlplane_netbox_tag` tag is a
# control-plane node, everything else a worker. The static list below is
# only a fallback for when no host is tagged yet. Designed target: 5
# members, each on a distinct physical host (the 4 k8s-server VMs + the
# kosmos Pi) so the etcd/kube-apiserver quorum survives any single host.
talos_controlplane_netbox_tag: "k8s-controlplane"
talos_controlplane_hosts:
  - "k8s-server-01"
  - "k8s-server-02"
  - "k8s-server-03"
  - "k8s-server-04"
  - "Kosmos"   # NetBox device names are capitalised — this must match the inventory hostname

# First control-plane node — `talosctl bootstrap` is issued here exactly
# once to initialise etcd. Its maintenance-mode IP is the NetBox primary
# IP (ansible_host).
talos_bootstrap_host: "{{ talos_controlplane_hosts[0] }}"

# --- Install disk -------------------------------------------------------
# Uniformly /dev/sda across the fleet: the x86 VMs present their scsi0 disk
# as /dev/sda, and the Pis boot from a USB→NVMe SSD adapter (a documented
# prerequisite — see docs/talos-bootstrap.md) which also enumerates as
# /dev/sda. Override per host only for an oddball node.
talos_install_disk: "/dev/sda"

# --- Image Factory schematics -------------------------------------------
# From Talos 1.14 installers come only from the Image Factory, so every
# node's machine.install.image names a schematic. Single-sourced from versions.env
# like the versions above: 00-pxe (Pi netboot assets) and opentofu (VM boot
# ISO) read the same two IDs, so the build a node boots and the build it
# installs cannot drift. See docs/design/talos-image-schematics.md.
talos_schematic_id: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^TALOS_SCHEMATIC_ID=(.+)$', multiline=True) | first | trim }}
talos_pi_schematic_id: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^TALOS_PI_SCHEMATIC_ID=(.+)$', multiline=True) | first | trim }}
# System extensions both schematics carry — Longhorn's prerequisites
# (docs/design/longhorn.md). tasks/upgrade.yaml verifies them on every node
# it rolls.
talos_system_extensions:
  - iscsi-tools
  - util-linux-tools

# --- Local build/output paths -------------------------------------------
# Render inputs + outputs land here on the operator workstation.
# Git-ignored (see repo-root .gitignore) — they contain cluster secrets.
# Only the SOPS-encrypted secret bundle (below) is committed.
talos_build_dir: "{{ playbook_dir }}/../.talos"
talos_patch_dir: "{{ talos_build_dir }}/patches"
talos_base_dir: "{{ talos_build_dir }}/base"
talos_secrets_plain: "{{ talos_build_dir }}/secrets.yaml"
talos_clusterconfig_dir: "{{ talos_build_dir }}/clusterconfig"
talos_talosconfig: "{{ talos_clusterconfig_dir }}/talosconfig"

# The committed `talosctl gen secrets` bundle (CA keys + tokens), generated
# once and reused so the PKI never rotates under running nodes. config.yaml
# decrypts it into the build dir for the render and removes it after.
talos_secrets_sops: "{{ role_path }}/files/secrets.sops.yaml"

# The cluster kubeconfig is merged into the operator's default kubeconfig
# (preserving other clusters' contexts), not dropped in the repo.
talos_kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config"

# --- CNI seed -----------------------------------------------------------
# The machine config ships no CNI (patches/cluster.yaml.j2: cni none, proxy
# disabled), so tasks/cni.yaml installs Cilium once, right after bootstrap;
# kubernetes/cilium/ (Flux) declares the same release and owns it from then
# on. The values file is Flux's copy, read in place so the two can never
# drift. See docs/design/cilium-bootstrap.md.
cilium_chart: "oci://quay.io/cilium/charts/cilium"
cilium_release_name: "cilium"
cilium_release_namespace: "kube-system"
cilium_values_file: "{{ role_path }}/../../../kubernetes/cilium/app/values.yaml"

# A guest reports less RAM than Proxmox configures, because firmware and the
# kernel reserve some (~210 MB on a 4000 MB Talos VM). tasks/resize.yaml
# compares against NetBox with this slack.
talos_resize_tolerance_mb: 400

# Binaries (overridable if not on PATH). qm is absolute because a
# non-interactive SSH session on a Proxmox host does not get /usr/sbin.
talos_qm_bin: "/usr/sbin/qm"
talosctl_bin: "talosctl"
sops_bin: "sops"
helm_bin: "helm"
kubectl_bin: "kubectl"
