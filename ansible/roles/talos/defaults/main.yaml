---
# Talos OS-library defaults.
#
# Cluster identity lives here (not in inventory/group_vars/talos.yaml,
# as proxmox's does in group_vars/proxmox.yaml) on purpose: the Talos
# bootstrap play (playbooks/talos.yaml) generates configs and bootstraps
# etcd from a `hosts: localhost` play, because Talos nodes have no SSH or
# Python and cannot be targeted directly. localhost is not in the `talos`
# inventory group, so it never loads group_vars/talos.yaml — role
# defaults are the one place every talos play (localhost and per-node)
# reliably sees these values.

# --- Versions -----------------------------------------------------------
# Single-sourced from repo-root versions.env (read via role_path so it
# resolves no matter which playbook includes the role). Bump the version
# THERE — never inline it here. role_path is .../ansible/roles/talos, so
# ../../../ is the repo root.
talos_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^TALOS_VERSION=(.+)$', multiline=True) | first | trim }}
talos_kubernetes_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^KUBERNETES_VERSION=(.+)$', multiline=True) | first | trim }}

# Multi-arch installer image (manifest list covers amd64 + arm64), so the
# same reference works for the x86 VMs and the arm64 Pis.
talos_install_image: "ghcr.io/siderolabs/installer:{{ talos_version }}"

# --- Cluster identity ---------------------------------------------------
talos_cluster_name: "homelab"

# Shared control-plane VIP. Talos floats this across the control-plane
# nodes (machine.network.interfaces[].vip), so the kube-apiserver endpoint
# survives any single control-plane node going down. Must be a free
# address on the node LAN (documented as 192.168.1.0/24) that the LAN DHCP
# server is NOT handing out.
talos_vip: "192.168.1.100"
talos_cluster_endpoint: "https://{{ talos_vip }}:6443"

# Interface the VIP attaches to. Talos names the first NIC eth0 on both
# the virtio VMs and the Pis. Override per-environment if predictable
# naming differs.
talos_primary_interface: "eth0"

# --- Node roles ---------------------------------------------------------
# Control-plane membership. Everything else in groups['talos'] is a
# worker. 5 members, each on a DISTINCT physical host: the 4 k8s-server
# VMs (one per NUC — rumba/tango/salsa/samba) plus 1 Raspberry Pi
# (kosmos). This spreads the control plane across 5 separate machines, so
# the kube-apiserver/etcd quorum survives any single physical host (and
# its co-located guests) going down. 5 is also an odd etcd quorum.
#
# The control-plane Pi should boot from a USB SSD, not the SD card (etcd
# is write-heavy); if it does, override talos_install_disk to /dev/sda for
# it. vostok was demoted to a worker to keep the count odd and the failure
# domains one-per-host.
talos_controlplane_hosts:
  - "k8s-server-01"
  - "k8s-server-02"
  - "k8s-server-03"
  - "k8s-server-04"
  - "kosmos"

# First control-plane node — `talosctl bootstrap` is issued here exactly
# once to initialise etcd. Its maintenance-mode IP is resolved from the
# NetBox primary IP (ansible_host).
talos_bootstrap_host: "{{ talos_controlplane_hosts[0] }}"

# --- Install disk -------------------------------------------------------
# Where Talos writes the system. Resolved per node from the hardware
# class: the x86 VMs present their scsi0 disk as /dev/sda; the Pis install
# to the SD card (/dev/mmcblk0). Override to /dev/sda for USB-SSD-booted
# Pis (recommended for control-plane Pis). Evaluated against the *target*
# host's groups, so it is correct both in apply.yaml (host == node) and in
# config.yaml's per-node loop (via hostvars[item].group_names in the
# patch templates).
talos_install_disk: "{{ '/dev/mmcblk0' if 'pis' in group_names else '/dev/sda' }}"

# --- Local build/output paths -------------------------------------------
# Generated machine configs and the fetched kubeconfig/talosconfig land
# here on the operator workstation. Git-ignored (see repo-root
# .gitignore) — they contain cluster secrets. Only the SOPS-encrypted
# secrets bundle below is committed.
talos_build_dir: "{{ playbook_dir }}/../.talos"

# Committed, SOPS-encrypted Talos secrets bundle (cluster CA keys, machine
# + bootstrap tokens). Generated once on first run, then reused so re-runs
# produce identical PKI. Covered by the role-files rule in .sops.yaml.
talos_secrets_sops: "{{ role_path }}/files/secrets.sops.yaml"

# talosctl/sops/kubectl binaries (overridable if not on PATH).
talosctl_bin: "talosctl"
sops_bin: "sops"
