---
# The DNS chain. See docs/design/dns-chain.md.

# The only hop in the chain that can speak DoT, so it does. Mullvad refuses
# plain :53 from non-VPN clients, which makes DoT the only way to use it.
dns_public_forwarders:
  - address: "9.9.9.9"
    tls_name: quad9
    hostname: dns.quad9.net
  - address: "194.242.2.2"
    tls_name: mullvad
    hostname: dns.mullvad.net

dns_tls_ca_file: /etc/ssl/certs/ca-certificates.crt

# Resolved through the full forwarder path by the role's own check. A local
# wildcard lookup cannot tell a working upstream from a broken one.
dns_public_probe_name: deb.debian.org

# Short record and negative-cache TTLs, so a changed ingress recovers fast.
dns_zone_ttl: 300
dns_zone_negative_ttl: 60

# Pinned by digest, because lancache-dns publishes only `latest`. The digest
# pins the code, not the domain list, which it regenerates at every start.
dns_lancache_image: "lancachenet/lancache-dns:latest@sha256:6e046a40e9f0467b1df97ca2ba9b8b7c0d4404736a349c0f8df11fa212871a03"
dns_lancache_dir: /opt/lancache-dns
dns_lancache_probe_domain: "lancache.steamcontent.com"

# The fail-open lever. False stops the container, so Pi-hole's strict-order
# falls through to Bind9 and the CDN domains resolve to the real CDN.
dns_lancache_enabled: true

# BIND's statistics channel (loopback) and the exporter that serves it to the
# cluster. docs/design/host-monitoring.md.
dns_stats_port: 8053
dns_exporter_port: 9119

# Unpinned: Pi-hole publishes no package. The pair's versions are asserted
# equal instead, at the end of playbooks/dns.yaml.
dns_pihole_installer_url: "https://install.pi-hole.net"

# The VRRP group the Pi-hole VIP floats on. It must be unique on the LAN;
# roles/dns/README.md gives the capture that checks.
dns_pihole_vrid: 53
