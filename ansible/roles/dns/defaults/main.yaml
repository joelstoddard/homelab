---
# The DNS chain. See docs/design/dns-chain.md.

# The only hop in the chain that can speak DoT, so it does. Mullvad refuses
# plain :53 from non-VPN clients, which makes DoT the only way to use it.
dns_public_forwarders:
  - address: "9.9.9.9"
    tls_name: quad9
    hostname: dns.quad9.net
  - address: "194.242.2.2"
    tls_name: mullvad
    hostname: dns.mullvad.net

dns_tls_ca_file: /etc/ssl/certs/ca-certificates.crt

# Resolved through the full forwarder path by the role's own check. A local
# wildcard lookup cannot tell a working upstream from a broken one.
dns_public_probe_name: deb.debian.org

# The hosts allowed to query Bind9: the lancache-dns pair, which forwards to
# it, and the Pi-hole pair, which reaches it directly when lancache-dns is
# down. No client ever queries it.
dns_bind9_clients: >-
  {{ (dns_lancache_addresses | default({}) | dict2items | map(attribute='value') | list)
     + (dns_pihole_addresses | default({}) | dict2items | map(attribute='value') | list) }}

# Refresh, retry and expire describe a secondary that does not exist. The
# record and negative-cache TTLs are short so a changed ingress recovers fast.
dns_zone_ttl: 300
dns_zone_refresh: 3600
dns_zone_retry: 600
dns_zone_expire: 604800
dns_zone_negative_ttl: 60
dns_zone_rname: "hostmaster"

# lancache-dns. Pinned by tag; the image regenerates its RPZ from
# uklans/cache-domains at every start, so the tag is the only version surface.
dns_lancache_image: "lancachenet/lancache-dns:latest"
dns_lancache_dir: /opt/lancache-dns
dns_lancache_probe_domain: "lancache.steamcontent.com"

# The fail-open lever. False stops the container, so Pi-hole's strict-order
# falls through to Bind9 and the CDN domains resolve to the real CDN.
dns_lancache_enabled: true
