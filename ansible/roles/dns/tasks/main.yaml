---
# The DNS chain. See docs/design/dns-chain.md.
#
# Each link of the chain is its own container, so each gets its own task file.

- name: Require Debian 13 or later.
  # Bind9 needs 9.20 for DoT forwarders and lancache-dns needs Compose v2;
  # Debian 12 ships BIND 9.18 and Compose v1.
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int >= 13
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_major_version }}; the DNS chain needs
      Debian 13 — see the "Requirements" section of ansible/roles/dns/README.md.
  tags: [always]

- name: Load the dns group vars (SOPS-encrypted).
  # ansible.cfg does not enable the sops vars plugin, so this file never
  # auto-loads. roles/alloy/tasks/main.yaml loads its own the same way.
  community.sops.load_vars:
    file: "{{ inventory_dir }}/group_vars/dns.sops.yaml"
  no_log: true
  tags: [always]

- name: Require the chain inputs.
  tags: [always]
  ansible.builtin.assert:
    that:
      - dns_domain is defined
      - dns_domain | length > 0
      - dns_traefik_lb_ip is defined
      - dns_traefik_lb_ip | length > 0
      - dns_bind9_addresses is defined
      - dns_bind9_addresses | length > 0
    fail_msg: >-
      dns_domain, dns_traefik_lb_ip and dns_bind9_addresses must be set — see
      the "Group variables" section of ansible/roles/dns/README.md.

- name: Refuse to configure a link that resolves through the chain.
  ansible.builtin.import_tasks: resolv.yaml

- name: Serve the authoritative zone from Bind9.
  ansible.builtin.import_tasks: bind9.yaml
  when: "'bind9' in group_names"
  tags: [bind9]

- name: Divert the game CDNs with lancache-dns.
  ansible.builtin.import_tasks: lancache.yaml
  when: "'lancache' in group_names"
  tags: [lancache]

- name: Filter and answer the LAN with Pi-hole.
  ansible.builtin.import_tasks: pihole.yaml
  when: "'pihole' in group_names"
  tags: [pihole]

- name: Float the Pi-hole VIP with keepalived.
  # After Pi-hole, so the health check finds a resolver from the start.
  ansible.builtin.import_tasks: keepalived.yaml
  when: "'pihole' in group_names"
  tags: [pihole, keepalived]
