---
# A link that resolves through the chain deadlocks a cold rebuild. This
# asserts and never repairs: see docs/design/dns-chain.md.

- name: Fail when the link resolves through the chain.
  ansible.builtin.assert:
    that: ansible_facts.dns.nameservers | default([]) | intersect(_dns_self_addresses) | length == 0
    fail_msg: >-
      /etc/resolv.conf on {{ inventory_hostname }} points into the DNS chain,
      which deadlocks a cold rebuild. Set the resolvers in the Proxmox
      container config (opentofu/modules/lxc `dns_servers`) and re-apply the
      LXC — editing the file here does not survive the next `pct start`.
  vars:
    _dns_self_addresses: >-
      {{ (dns_bind9_addresses.values() | list)
         + (dns_pihole_addresses.values() | list)
         + (dns_lancache_addresses.values() | list)
         + [dns_pihole_vip] }}
