---
# Network config (used by Debian preseed)
gateway: "{{ ansible_default_ipv4.gateway }}"
dns_server: "192.168.1.2"
cidr_subnet: "/24"
ntp_server: "192.168.1.1"
preferred_keyboard_layout: "us"
country_code: "GB"
timezone: "Europe/London"
locale: "en_GB.UTF-8"

# SSH key authorised on installed hosts (root account, for first-boot Ansible takeover)
ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

# Admin email (Proxmox notifications, etc.). Override per-host or
# per-group; the default is a placeholder so the var is always defined.
admin_email: "root@localhost"

# PXE server's address on the LAN (used in iPXE scripts and preseed URLs).
# Defaults to localhost's IPv4. Override per environment if needed.
pxe_server_ip: "{{ ansible_default_ipv4.address }}"

# Whether dnsmasq runs in DHCP-proxy mode (does not allocate IPs).
# Almost always true; leave as-is unless we replace the LAN's DHCP server.
dhcp_proxy: true

# iPXE chainloader (TFTP-served, the only file the NIC's PXE ROM fetches).
ipxe_url: "https://boot.ipxe.org/x86_64-efi/ipxe.efi"
ipxe_sha256: ""  # leave empty to skip checksum; set to pinned hash for production

# arm64 iPXE chainloader (for the Raspberry Pis netbooting Talos). Only
# downloaded when there are talos-platform hosts in the pxe group.
# snp.efi is the UEFI Simple-Network-Protocol build that the EDK2 UEFI
# firmware (below) hands off to once it has done arm64 UEFI PXE. See
# docs/talos-bootstrap.md for the Pi netboot prerequisites.
ipxe_arm64_url: "https://boot.ipxe.org/arm64-efi/snp.efi"
ipxe_arm64_sha256: ""

# pftf/RPi4 EDK2 UEFI firmware. A Pi 4 cannot load an EFI app
# (ipxe-arm64.efi) directly from its EEPROM — it must first EEPROM-netboot
# this UEFI layer, which then does standard arm64 UEFI PXE (client-arch 11)
# and fetches our iPXE. Unpacked into the dnsmasq TFTP root; only when there
# are talos PXE hosts. (Requires `unzip` on the operator for unarchive.)
edk2_rpi4_version: "v1.52"
edk2_rpi4_url: >-
  https://github.com/pftf/RPi4/releases/download/{{ edk2_rpi4_version }}/RPi4_UEFI_Firmware_{{ edk2_rpi4_version }}.zip

# Talos netboot assets (arm64, served over HTTP to the Pis).
#
# talos_version is single-sourced from repo-root versions.env (read via
# role_path: .../ansible/roles/00-pxe, so ../../../ is the repo root) — bump
# it there, not here.
#
# The asset URLs point at the Talos Image Factory build for the plain
# sbc-raspberrypi overlay (rpi_generic). talos_pi_schematic_id MUST match the
# talos role's talos_pi_schematic_id so the netbooted kernel/initramfs and the
# on-disk installer (talosImageURL) are the SAME build — a bare Pi will not
# netboot the vanilla siderolabs arm64 assets.
talos_version: >-
  {{ lookup('file', role_path ~ '/../../../versions.env')
     | regex_findall('^TALOS_VERSION=(.+)$', multiline=True) | first | trim }}
# Image Factory schematic for the arm64 Pis (plain sbc-raspberrypi overlay).
talos_pi_schematic_id: "ee21ef4a5ef808a9b7484cc0dda0f25075021691c8c09a276591eedb638ea1f9"
talos_arm64_kernel_url: >-
  https://factory.talos.dev/image/{{ talos_pi_schematic_id }}/{{ talos_version }}/kernel-arm64
talos_arm64_initramfs_url: >-
  https://factory.talos.dev/image/{{ talos_pi_schematic_id }}/{{ talos_version }}/initramfs-arm64.xz

# Kernel cmdline for the Talos netboot (maintenance mode — no talos.config,
# so the node waits for `talosctl apply-config` from the talos role).
talos_kernel_cmdline: >-
  talos.platform=metal console=tty1 console=ttyS0,115200n8 init_on_alloc=1 slab_nomerge pti=on

# Debian netinstall artifacts.
# These pin the version we PXE-boot. Bump together when upgrading.
debian_version: "trixie"
debian_arch: "amd64"
debian_kernel_url: >-
  https://deb.debian.org/debian/dists/{{ debian_version }}/main/installer-{{ debian_arch }}/current/images/netboot/debian-installer/{{ debian_arch }}/linux
debian_initrd_url: >-
  https://deb.debian.org/debian/dists/{{ debian_version }}/main/installer-{{ debian_arch }}/current/images/netboot/debian-installer/{{ debian_arch }}/initrd.gz
debian_apt_mirror: "deb.debian.org"

# root_password is intentionally not defaulted. Must be supplied via:
# - inventory/host_vars/<host>.sops.yaml (preferred; loaded via the
#   community.sops.load_vars pre-task in pxe.yaml)
# - --extra-vars (one-off testing)
