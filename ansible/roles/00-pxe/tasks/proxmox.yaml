---
# Per-OS task file: Proxmox path. Runs after common.yaml.
# Hosts: localhost. Iterates groups['proxmox'] to render per-host artifacts.

- name: Ensure debian artifact directory exists.
  ansible.builtin.file:
    path: "{{ role_path }}/files/http/debian/{{ debian_version }}"
    state: directory
    mode: "0755"

- name: Download Debian netinstall kernel.
  ansible.builtin.get_url:
    url: "{{ debian_kernel_url }}"
    dest: "{{ role_path }}/files/http/debian/{{ debian_version }}/linux"
    mode: "0644"

- name: Download Debian netinstall initrd.
  ansible.builtin.get_url:
    url: "{{ debian_initrd_url }}"
    dest: "{{ role_path }}/files/http/debian/{{ debian_version }}/initrd.gz"
    mode: "0644"

- name: Render per-host iPXE script.
  ansible.builtin.template:
    src: host.ipxe.j2
    dest: "{{ role_path }}/files/http/boot/{{ hostvars[item]['mac_address'] | lower | replace(':', '-') }}.ipxe"
    mode: "0644"
  loop: "{{ groups['proxmox'] }}"
  vars:
    target_hostname: "{{ item }}"
    mac_address: "{{ hostvars[item]['mac_address'] }}"
    fqdn: "{{ hostvars[item]['fqdn'] }}"

- name: Render per-host Debian preseed.
  ansible.builtin.template:
    src: preseed-debian.cfg.j2
    dest: "{{ role_path }}/files/http/preseed/{{ hostvars[item]['mac_address'] | lower | replace(':', '-') }}.cfg"
    mode: "0644"
  loop: "{{ groups['proxmox'] }}"
  vars:
    target_hostname: "{{ item }}"
    mac_address: "{{ hostvars[item]['mac_address'] }}"
    fqdn: "{{ hostvars[item]['fqdn'] }}"
    target_ip: "{{ hostvars[item]['ansible_host'] }}"
    disk_device: "{{ hostvars[item]['disk_device'] }}"
    root_password: "{{ hostvars[item]['root_password'] }}"
