---
# SOPS config — defines which Age recipients encrypt which paths.
# `sops` walks up from the file being encrypted to find this config.
#
# To add a new operator, append their Age public key under `age:` for the
# matching rule, then re-encrypt every covered file:
#   sops updatekeys ansible/inventory/host_vars/<host>.sops.yaml
creation_rules:
  - path_regex: ansible/inventory/host_vars/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  - path_regex: ansible/inventory/group_vars/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  - path_regex: opentofu/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  # Per-resource secrets files (dotenv format; the Makefile
  # eval-sources them as `export TF_VAR_*=...` lines).
  - path_regex: opentofu/resources/.*/secrets\.env$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
