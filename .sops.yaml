---
# SOPS config — defines which Age recipients encrypt which paths.
# `sops` walks up from the file being encrypted to find this config.
#
# To add a new operator, append their Age public key under `age:` for the
# matching rule, then re-encrypt every covered file:
#   sops updatekeys ansible/inventory/host_vars/<host>.sops.yaml
creation_rules:
  - path_regex: ansible/inventory/host_vars/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  - path_regex: ansible/inventory/group_vars/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  # Talos cluster secrets bundle (CA keys + join tokens), generated once by
  # the talos role and reused so the cluster PKI never rotates underneath
  # running nodes.
  - path_regex: ansible/roles/talos/files/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  # Per-cluster talos role vars that are secret or not public (skylab's
  # Tailscale auth key and tailnet name), loaded by tasks/cluster.yaml.
  - path_regex: ansible/roles/talos/vars/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  - path_regex: opentofu/.*\.sops\.ya?ml$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  # Per-resource secrets files (dotenv format; the Makefile
  # eval-sources them as `export TF_VAR_*=...` lines).
  - path_regex: opentofu/resources/.*/secrets\.env$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
  # Skylab's tree: the operator key and the skylab key, the only key in
  # skylab's sops-age Secret, so a compromised skylab decrypts nothing else.
  # Must precede the general kubernetes/ rule (first match wins);
  # docs/design/skylab-flux.md, "Decryption: the skylab key".
  - path_regex: kubernetes/clusters/skylab/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData|spec)$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv,age16ua3q4295kd5dgzp8qjdtu5rqguhalyw488dv22ppcsa30jdfqxqhud5vc
  # Kubernetes resources under kubernetes/ — decrypted in-cluster by Flux's
  # kustomize-controller (any Kustomization with a decryption block, secretRef
  # sops-age). Only data/stringData (Secrets) and spec (CRs whose values are
  # LAN addresses, e.g. the Cilium LB pool) are encrypted, so kustomize can
  # still read apiVersion/kind/metadata. Always edit with `sops <file>`.
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData|spec)$
    age: age1h5hafnt22aqn7uahcsmv5v8gfgwcxanypw0lantcush7jppt99fskz6vcv
