# Second release of the same chart: loki.source.kubernetes_events cannot be
# sharded across the DaemonSet (every member would emit every event), so it
# runs once, here. Version pinned alongside alloy/helmrelease.yaml — bump both.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events
spec:
  interval: 1h0m0s
  releaseName: alloy-events
  timeout: 10m0s
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-events-values
