# One Alloy per node: scrapes its own kubelet/cAdvisor, exports node metrics
# from the host mounts and tails /var/log/pods; cluster-wide targets are the
# alloy-cluster release's. Config is config/config.alloy, mounted from the
# alloy-config ConfigMap; the reloader picks up edits without a restart.
# docs/design/observability.md.
alloy:
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  clustering:
    enabled: false
  mounts:
    varlog: true
    extra:
      - name: procfs
        mountPath: /host/proc
        readOnly: true
      - name: sysfs
        mountPath: /host/sys
        readOnly: true
      - name: rootfs
        mountPath: /host/root
        readOnly: true
        mountPropagation: HostToContainer
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # Pod log files under /var/log/pods are root-owned 0640; the image's default
  # user cannot read them.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # The Pi pods were OOMKilled at 512Mi while their remote-write WAL grew
  # through a Prometheus outage, and 500m throttles a scrape of ~370k series.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
controller:
  type: daemonset
  hostPID: true
  # hostNetwork so the unix exporter reports the node's interfaces, not the
  # pod's; port 12345 is then a node port, free on Talos.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  # Control-plane nodes carry no workloads, but they do have a kubelet and
  # logs worth collecting.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: procfs
        hostPath:
          path: /proc
      - name: sysfs
        hostPath:
          path: /sys
      - name: rootfs
        hostPath:
          path: /
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "12345"
