apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alloy
resources:
  - namespace.yaml
  - helmrepository.yaml
  - alloy/helmrelease.yaml
  - config
configMapGenerator:
  - name: alloy-values
    files:
      - values.yaml=alloy/values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
