# The River configs as ConfigMaps the charts mount (alloy.configMap.create is
# false in every values file). Substitution is disabled on them: this layer
# has no postBuild today, but the annotation makes that safe to change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
  - name: alloy-cluster-config
    files:
      - cluster.alloy
  - name: alloy-events-config
    files:
      - events.alloy
