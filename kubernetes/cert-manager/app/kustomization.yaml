apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
# values.yaml -> the ConfigMap the HelmRelease reads via valuesFrom. No hash
# suffix so the HelmRelease can name it; the watch label makes
# helm-controller reconcile on content changes (same pattern as longhorn/app).
configMapGenerator:
  - name: cert-manager-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
