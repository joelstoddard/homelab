# The LAN discovery agent (docs/design/network-discovery.md). The Fleet
# credentials Secret is SOPS-encrypted, hence the decryption block.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orb-agent
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/orb-agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
