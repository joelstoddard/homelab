# The metasearch instance itself, one stateless replica (docs/design/searxng.md).
# Config reaches it three ways: SEARXNG_* env vars for everything upstream
# exposes, the settings ConfigMap for open_metrics, and the SOPS Secret for the
# cookie-signing key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
      # Deliberately no prometheus.io/scrape: /metrics is behind basic auth,
      # which the annotated-pods scrape cannot carry — it would log 401s
      # forever. The credentialed job is in alloy/app/config/config.alloy.
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.17-274b63b67
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng
                  key: SEARXNG_SECRET
            - name: SEARXNG_BASE_URL
              value: https://searx.${DOMAIN}/
            - name: SEARXNG_LIMITER
              value: "true"
            - name: SEARXNG_VALKEY_URL
              value: valkey://valkey.searxng.svc.cluster.local:6379/0
            # The OpenMetrics counters live in the worker process, so a second
            # worker would serve half the scrapes from its own set. The image
            # leaves this unset (granian defaults to 1); pin it so an upstream
            # default change cannot quietly halve the numbers.
            - name: GRANIAN_WORKERS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            # TODO: measure a week of real use and cap just above the peak.
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
