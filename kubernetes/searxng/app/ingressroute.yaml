# No Certificate and no tls.secretName: TLSStore/default serves the wildcard, so
# a new hostname needs one route and nothing else, and Pi-hole's address=/<domain>/
# already resolves it (docs/design/ingress-tls.md).
#
# No auth middleware, deliberately: basic auth prompts on every keyword search
# and breaks the OpenSearch add flow, so the LAN and the tailnet are the boundary.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`searx.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: searxng
          port: 8080
