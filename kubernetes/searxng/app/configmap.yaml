# Everything upstream exposes as a SEARXNG_* variable is set on the Deployment
# instead; open_metrics is the exception, with no env override, so the metrics
# password can only arrive here. Nothing else in this file may contain a $ —
# Flux's envsubst runs over every manifest in this layer (docs/design/searxng.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings: true
    general:
      open_metrics: "${SEARXNG_OPEN_METRICS}"
  # Upstream trusts X-Forwarded-For only from 127.0.0.0/8, so behind Traefik
  # every client is attributed to one pod IP and the instance shares a single
  # rate-limit bucket. See docs/design/searxng.md, "Traps".
  limiter.toml: |
    [botdetection]
    trusted_proxies = [
      '10.244.0.0/16',
    ]
