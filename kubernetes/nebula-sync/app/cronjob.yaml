# Without CRON set, nebula-sync syncs once and exits non-zero on failure, so
# the Job's own status is the sync's result.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nebula-sync
  labels:
    app.kubernetes.io/name: nebula-sync
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nebula-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nebula-sync
              # Pinned by index digest; it carries amd64 and arm64.
              image: ghcr.io/lovelaze/nebula-sync:v0.11.3@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
              env:
                - name: PIHOLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nebula-sync
                      key: PIHOLE_PASSWORD
                # Instance names, never the VIP: the VIP can move to pihole-02,
                # which would make it its own primary.
                - name: PRIMARY
                  value: "https://pihole-01.lan-services.svc.cluster.local|$(PIHOLE_PASSWORD)"
                - name: REPLICAS
                  value: "https://pihole-02.lan-services.svc.cluster.local|$(PIHOLE_PASSWORD)"
                # Gravity tables only. The dns role owns each instance's config,
                # so every SYNC_CONFIG_* stays unset (false).
                - name: FULL_SYNC
                  value: "false"
                - name: SYNC_GRAVITY_GROUP
                  value: "true"
                - name: SYNC_GRAVITY_AD_LIST
                  value: "true"
                - name: SYNC_GRAVITY_AD_LIST_BY_GROUP
                  value: "true"
                - name: SYNC_GRAVITY_DOMAIN_LIST
                  value: "true"
                - name: SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP
                  value: "true"
                - name: SYNC_GRAVITY_CLIENT
                  value: "true"
                - name: SYNC_GRAVITY_CLIENT_BY_GROUP
                  value: "true"
                - name: RUN_GRAVITY
                  value: "true"
                # Pi-hole serves a self-signed certificate.
                - name: CLIENT_SKIP_TLS_VERIFICATION
                  value: "true"
                # Each run rebuilds gravity on pihole-02 from 46 lists; under the
                # Job's 600 s deadline so a slow run still ends in a clear error.
                - name: CLIENT_TIMEOUT_SECONDS
                  value: "300"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
