# Git owns this file; Home Assistant owns everything else under /config.
# What belongs here turned out to be narrow — see docs/design/home-assistant.md.

# Pulls in zeroconf, ssdp, dhcp, usb and backup. Removing it removes discovery,
# which is the entire reason this pod runs on the node's network stack.
default_config:

# No homeassistant: block. Any one of its twelve core keys makes Home Assistant
# treat ALL core config as YAML-managed and locks the UI, including the location
# picker (core_config.py, the `any(k in config ...)` guard).

# No http: block either: Home Assistant migrates it into .storage once and
# ignores YAML forever after. Trusted proxies live in the UI.

# YAML-only, unlike the two blocks above: the integration ships no config flow,
# so this is the one place it can be set. Serves /api/prometheus behind a
# bearer token, scraped by the alloy layer — docs/design/observability.md.
prometheus:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
