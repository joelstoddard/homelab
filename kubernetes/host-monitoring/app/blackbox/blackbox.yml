# Three probers, no ICMP: that needs NET_RAW, which PodSecurity baseline
# forbids, and a TCP connect to a UI port gives the same up/down and RTT.
modules:
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: true
  dns_lookup:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: grafana.com
      query_type: A
  # The records the chain itself serves: Bind9's wildcard and lancache-dns's
  # CDN rewrite. A wrong answer fails the probe, not only a missing one.
  dns_wildcard:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: blackbox-probe.${DOMAIN}
      query_type: A
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '\sA\s+${TRAEFIK_LB_IP}\z'
  dns_lancache:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: lancache.steamcontent.com
      query_type: A
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '\sA\s+${LANCACHE_LB_IP}\z'
