apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: host-monitoring
resources:
  - namespace.yaml
  - helmrepository.yaml
  - pve-exporter.yaml
  - secret-pve-exporter.sops.yaml
  - pihole-exporter.yaml
  - secret-pihole-exporter.sops.yaml
  - blackbox-exporter.yaml
  - graphite-exporter.yaml
# This layer is substituted by Flux: every generator input here may contain
# the cluster-secrets variable names and no other $ — the River file sits in
# config/ with substitution disabled, the targets file deliberately here.
configMapGenerator:
  - name: blackbox-config
    files:
      - blackbox.yml=blackbox/blackbox.yml
  - name: graphite-mapping
    files:
      - mapping.yml=graphite/mapping.yml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
