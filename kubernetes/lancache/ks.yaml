# The LANCache HTTP cache that lancache-dns sends game CDN names to —
# docs/design/lancache.md.
#
# dependsOn cilium-lb for the pool the pinned address comes from, and
# cluster-secrets for LANCACHE_LB_IP and VOYAGER_IP. No traefik: clients reach
# the pinned address directly, never through a route.
#
# No decryption block: this layer carries no *.sops.yaml, like glance.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lancache
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/lancache/app
  prune: true
  dependsOn:
    - name: cilium-lb
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
