# ClusterIssuers + the Cloudflare token. Separate from the cert-manager chart
# because these CRs need their CRD Established first (cert-manager has
# wait: true). dependsOn cluster-secrets for ${DOMAIN} and ${ACME_EMAIL};
# decryption for the token Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/cert-manager-issuers/app
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
