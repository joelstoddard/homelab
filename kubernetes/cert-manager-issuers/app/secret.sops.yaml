# Cloudflare API token for the DNS-01 solver, read from cert-manager's cluster
# resource namespace (cert-manager) because a ClusterIssuer has no namespace of
# its own. Scoped to the single zone with Zone:DNS:Edit + Zone:Zone:Read.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: REPLACE_ME
