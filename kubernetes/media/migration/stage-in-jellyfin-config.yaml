# One-shot, namespace media. Picks up what stage-out left on the share and
# writes it into the new Longhorn claim, using the media-library claim as its
# staging mount — so unlike stage-out it needs no PersistentVolume of its own.
#
# Applied by hand:
#   kubectl --context homelab apply -f kubernetes/media/migration/stage-in-jellyfin-config.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-in-jellyfin-config
  namespace: media
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              cp -a /media/.jellyfin-migration/. /config/
              echo "STAGED:  $(du -sh /media/.jellyfin-migration | cut -f1)"
              echo "RESTORED: $(du -sh /config | cut -f1)"
              STAGED_DB=$(stat -c %s /media/.jellyfin-migration/data/jellyfin.db)
              RESTORED_DB=$(stat -c %s /config/data/jellyfin.db)
              echo "STAGED_DB: $STAGED_DB bytes"
              echo "RESTORED_DB: $RESTORED_DB bytes"
              STAGED_FILES=$(find /media/.jellyfin-migration -type f | wc -l)
              RESTORED_FILES=$(find /config -type f | wc -l)
              echo "STAGED_FILES: $STAGED_FILES"
              echo "RESTORED_FILES: $RESTORED_FILES"
              echo "SETTINGS: $(ls /config/config | wc -l) files"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 256Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media-library
            readOnly: true
