# One replica with strategy Recreate: the config claim is ReadWriteOnce and the
# database is SQLite, so a second pod either deadlocks on the volume or corrupts
# the database (docs/design/jellyfin.md).
#
# replicas: 0 until the config volume is migrated: an empty-library scan
# previously ran ffprobe hard enough to OOM-kill longhorn-csi-plugin and
# wedge a node (docs/design/arr-stack.md). PR-2 sets this to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
      # Deliberately no prometheus.io/scrape: Jellyfin serves no Prometheus
      # endpoint without a plugin, and Beyla already reports its RED metrics.
    spec:
      # The Pis cannot transcode and their USB storage is slow, so this follows
      # the Loki and Tempo precedent and stays on the amd64 workers.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:12.1.20260915-010956
          env:
            # Temporary hostname while the old namespace still owns
            # jellyfin.${DOMAIN}. PR-2 flips this with the route below.
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin-new.${DOMAIN}
          ports:
            - name: http
              containerPort: 8096
          # Every timeoutSeconds here is explicit because the default is 1 s,
          # and a library scan makes /health slower than that routinely
          # (docs/design/jellyfin.md "Probe timeouts").
          #
          # First start creates the database and can take minutes, so the
          # startup probe holds the liveness probe off for up to five.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            # The shared claim is read-write for the *arr applications. Jellyfin
            # keeps read-only semantics here, at the container, rather than
            # through a second PersistentVolume — same superblock, no conflict.
            - name: media
              mountPath: /media
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # Carried verbatim from the source manifest, still open: measure a
            # week of real use and cap just above the peak. A tight CPU limit
            # stutters playback and a runaway cache starves the Longhorn
            # replicas on EPHEMERAL (docs/design/jellyfin.md).
            limits:
              cpu: "3"
              memory: 2Gi
              ephemeral-storage: 10Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media-library
            readOnly: true
        # Transcodes and the image cache are regenerable, so they stay on the
        # node instead of costing three replicated writes on Longhorn.
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
        # The .NET runtime writes its shared-memory files here, which a
        # read-only root filesystem would otherwise refuse.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Carries no prometheus.io/scrape annotation for the same reason the pod does
# not: Jellyfin serves no Prometheus endpoint without a plugin, and Beyla
# already reports its RED metrics.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
# Temporary hostname: two IngressRoutes matching the same Host() rule leave
# Traefik to choose between them nondeterministically, so the cutover stays an
# explicit step rather than a race. PR-2 changes this to jellyfin.${DOMAIN} and
# deletes the old layer.
#
# No Certificate and no tls.secretName: TLSStore/default serves the wildcard,
# and Pi-hole's address=/<domain>/ already resolves it.
#
# No auth middleware, deliberately: Jellyfin has its own login, and a basic-auth
# prompt breaks every native client, which cannot answer one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin-new.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: jellyfin
          port: 8096
