# Session and transcode metrics, polled from Jellyfin's REST API. Jellyfin's own
# EnableMetrics endpoint carries .NET runtime counters and nothing about
# playback, so it stays off (docs/design/jellyfin.md).
#
# replicas: 0 alongside Jellyfin itself — the exporter polls it and would fail
# its probes against a Deployment scaled to zero. PR-2 sets this to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-exporter
  labels:
    app.kubernetes.io/name: jellyfin-exporter
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9594"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/rebelcore/jellyfin-exporter:v1.5.2
          args:
            - --collector.transcoding
            - --collector.tasks
          env:
            # The new namespace, not jellyfin.jellyfin.svc.
            - name: JELLYFIN_ADDRESS
              value: http://jellyfin.media.svc.cluster.local:8096
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-exporter
                  key: JELLYFIN_TOKEN
          ports:
            - name: metrics
              containerPort: 9594
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
