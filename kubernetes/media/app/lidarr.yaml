# Lidarr — same shape as sonarr.yaml and radarr.yaml, with twice the memory
# limit: an artist refresh walks far more rows than an episode or movie one.
# docs/design/arr-core.md carries the rationale for that shape: Recreate on a
# SQLite ReadWriteOnce claim, amd64, PUID/PGID, probe timeouts, and requests
# plus limits on every container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/name: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls41
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            # Binds Lidarr:Auth:ApiKey. The name is version-dependent and a
            # wrong one fails silently — the application generates its own key.
            - name: LIDARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: arr-apikeys
                  key: LIDARR_API_KEY
          ports:
            - name: http
              containerPort: 8686
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            # The export ROOT, never the downloads subdirectory: link() cannot
            # cross two mounts (docs/design/media-foundation.md, "Path identity").
            - name: media
              mountPath: /media
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/name: lidarr
spec:
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: http
---
# No Certificate and no tls.secretName: TLSStore/default serves the wildcard
# and Pi-hole already resolves the name. No auth middleware — Lidarr
# authenticates itself (docs/design/media-foundation.md, "Ingress and auth").
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`lidarr.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: lidarr
          port: 8686
