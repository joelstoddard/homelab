# SABnzbd metrics. Its key comes from exporter-apikeys, not arr-apikeys:
# SABnzbd mints its own in sabnzbd.ini and this only reads it back.
#
# The .svc name is load-bearing. SABnzbd rejects a Host header it does not
# recognise, and the in-cluster name is the one it exempts — the same reason
# the *arr reach it this way (docs/design/arr-stack.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd-exporter
  labels:
    app.kubernetes.io/name: sabnzbd-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9707"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: ["sabnzbd"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: http://sabnzbd.media.svc.cluster.local:8080
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: exporter-apikeys
                  key: SABNZBD_API_KEY
          ports:
            - name: metrics
              containerPort: 9707
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
