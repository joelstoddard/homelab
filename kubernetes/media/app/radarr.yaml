# Radarr — same shape as sonarr.yaml and lidarr.yaml; only the image, the port
# and the resource figures differ. docs/design/arr-core.md carries the
# rationale for that shape: Recreate on a SQLite ReadWriteOnce claim, amd64,
# PUID/PGID, probe timeouts, and requests plus limits on every container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls317
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            # Binds Radarr:Auth:ApiKey. The name is version-dependent and a
            # wrong one fails silently — the application generates its own key.
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: arr-apikeys
                  key: RADARR_API_KEY
          ports:
            - name: http
              containerPort: 7878
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            # The export ROOT, never the downloads subdirectory: link() cannot
            # cross two mounts (docs/design/media-foundation.md, "Path identity").
            - name: media
              mountPath: /media
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  selector:
    app.kubernetes.io/name: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
---
# No Certificate and no tls.secretName: TLSStore/default serves the wildcard
# and Pi-hole already resolves the name. No auth middleware — Radarr
# authenticates itself (docs/design/media-foundation.md, "Ingress and auth").
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`radarr.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: radarr
          port: 7878
