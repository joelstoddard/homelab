# Bazarr metrics; its key comes from exporter-apikeys, which only reads back the
# one Bazarr minted. This collector is the slow one and a large library will
# outgrow the annotation path's scrape timeout — see docs/design/arr-stack.md,
# "Metrics", for the symptom and the fix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr-exporter
  labels:
    app.kubernetes.io/name: bazarr-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9707"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: ["bazarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: http://bazarr.media.svc.cluster.local:6767
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: exporter-apikeys
                  key: BAZARR_API_KEY
          ports:
            - name: metrics
              containerPort: 9707
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
