# Substitution inputs for every layer whose manifests name the domain or a LAN
# address: Flux replaces ${DOMAIN}, ${TRAEFIK_LB_IP} and ${ACME_EMAIL} in the
# built manifests, so this public repo carries neither while diffs stay
# readable. The Secret lives in flux-system because substituteFrom resolves
# Secrets in the consuming Kustomization's own namespace, not the target's.
# wait: true so a consumer's dependsOn means the keys are actually there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/cluster-secrets/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
