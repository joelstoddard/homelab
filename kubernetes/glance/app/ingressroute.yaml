# No Certificate and no tls.secretName: TLSStore/default serves the wildcard, so
# a new hostname needs one route and nothing else, and Pi-hole's address=/<domain>/
# already resolves it (docs/design/ingress-tls.md).
#
# Behind basic auth, unlike SearXNG: this page is a complete map of the
# homelab's internal services on one screen, which is the same confidentiality
# argument that puts the Traefik dashboard behind a credential. One prompt per
# browser session is not the per-query friction that made SearXNG an exception.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glance
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`home.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: glance-auth
          namespace: traefik
      services:
        - name: glance
          port: 8080
