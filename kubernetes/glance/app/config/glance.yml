# Flux substitution runs before Glance's and both use the same sigil, so DOMAIN,
# NETBOX_URL and WEATHER_LOCATION must stay the only variables in this file,
# comments included. See docs/design/glance.md.
#
# url is followed by the browser; check-url is fetched by this pod, which
# cannot resolve the wildcard. Status codes below are measured, not assumed —
# re-measure with curl -L from a pod before changing one.
server:
  host: 0.0.0.0
  port: 8080
  proxied: true

# The dotfiles' ash-plus palette, monochrome: #121212 base and grey links, with
# its green and red kept for up and down.
theme:
  background-color: 0 0 7
  primary-color: 0 0 88
  positive-color: 79 32 51
  negative-color: 0 45 47
  contrast-multiplier: 1.1

branding:
  app-name: homelab
  logo-text: h
  hide-footer: true

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          # WEATHER_LOCATION is encrypted in cluster-secrets: this repo is public
          # and the location is personal. Glance geocodes "town, country" only.
          - type: group
            widgets:
              - type: weather
                location: ${WEATHER_LOCATION}
                hide-location: true
                units: metric
                hour-format: 24h
              - type: calendar
                title: Calendar
                title-url: https://calendar.google.com/

          - type: group
            widgets:
              - { type: repository, title: homelab, repository: joelstoddard/homelab, pull-requests-limit: 3, issues-limit: 3, commits-limit: 3 }
              - { type: repository, title: dotfiles, repository: joelstoddard/dotfiles, pull-requests-limit: 3, issues-limit: 3, commits-limit: 3 }
              - { type: repository, title: nvim, repository: joelstoddard/nvim, pull-requests-limit: 3, issues-limit: 3, commits-limit: 3 }

          # Off-cluster, so no check-url and no status dot — nothing here is
          # ours to probe. NETBOX_URL is encrypted for the reason the tenant
          # name never appears in this repo: it identifies the account.
          - type: bookmarks
            title: Dashboards
            groups:
              - links:
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: di:cloudflare
                  - title: Hetzner
                    url: https://console.hetzner.cloud
                    icon: di:hetzner
                  - title: NetBox
                    url: ${NETBOX_URL}
                    icon: di:netbox
                  - title: Bitwarden
                    url: https://vault.bitwarden.eu
                    icon: di:bitwarden
                  - title: Tailscale
                    url: https://login.tailscale.com/admin
                    icon: di:tailscale

      - size: full
        widgets:
          - type: search
            search-engine: https://searx.${DOMAIN}/search?q={QUERY}
            placeholder: Search
            autofocus: true
            target: _self
            bangs:
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}
              - title: Grafana
                shortcut: "!g"
                url: https://grafana.${DOMAIN}/?search=open&query={QUERY}

          # Icons are slugs the browser loads from a public CDN, so a wrong one
          # is a missing image rather than a startup error.
          - type: monitor
            title: Media
            cache: 1m
            sites:
              - title: Jellyfin
                url: https://jellyfin.${DOMAIN}
                check-url: http://jellyfin.media.svc:8096/health
                icon: di:jellyfin

              # /api/v1/status reaches the GitHub API, so it is not a probe of
              # this service. /appdata answers locally.
              - title: Seerr
                url: https://seerr.${DOMAIN}
                check-url: http://seerr.media.svc:5055/api/v1/status/appdata
                icon: di:seerr

              # / redirects to a login page that answers 200, so it proves
              # nothing. /ping is each app's own kubelet probe path.
              - title: Prowlarr
                url: https://prowlarr.${DOMAIN}
                check-url: http://prowlarr.media.svc:9696/ping
                icon: di:prowlarr

              - title: Sonarr
                url: https://sonarr.${DOMAIN}
                check-url: http://sonarr.media.svc:8989/ping
                icon: di:sonarr

              - title: Radarr
                url: https://radarr.${DOMAIN}
                check-url: http://radarr.media.svc:7878/ping
                icon: di:radarr

              - title: Lidarr
                url: https://lidarr.${DOMAIN}
                check-url: http://lidarr.media.svc:8686/ping
                icon: di:lidarr

              # Bazarr has no /ping. This path stays 200 if its auth is later
              # set to Basic, which makes every catch-all path 401.
              - title: Bazarr
                url: https://bazarr.${DOMAIN}
                check-url: http://bazarr.media.svc:6767/manifest.webmanifest
                icon: di:bazarr

              # The API answers 403 without a session. / is the only
              # unauthenticated probe, and returns 200 with the login page.
              - title: qBittorrent
                url: https://qbittorrent.${DOMAIN}
                check-url: http://qbittorrent.media-downloads.svc:8080/
                icon: di:qbittorrent

              # Every path redirects to the login page, so this dot proves the
              # web server answers and nothing more. See docs/design/glance.md.
              - title: SABnzbd
                url: https://sabnzbd.${DOMAIN}
                check-url: http://sabnzbd.media.svc:8080/robots.txt
                icon: di:sabnzbd

          - type: split-column
            widgets:
              - type: monitor
                title: Monitoring
                cache: 1m
                sites:
                  - title: Grafana
                    url: https://grafana.${DOMAIN}
                    # / redirects to the login page; this answers 200 without auth.
                    check-url: http://grafana.monitoring.svc/api/health
                    icon: di:grafana

              - type: monitor
                title: Home Automation
                cache: 1m
                sites:
                  - title: Home Assistant
                    url: https://homeassistant.${DOMAIN}
                    # hostNetwork, but the ClusterIP still reaches it (confirmed
                    # against the identically-topologied Alloy Service).
                    # /manifest.json answers unauthenticated with no redirect,
                    # unlike /.
                    check-url: http://home-assistant.home-assistant.svc:8123/manifest.json
                    icon: di:home-assistant

              - type: monitor
                title: Tools
                cache: 1m
                sites:
                  - title: SearXNG
                    url: https://searx.${DOMAIN}
                    check-url: http://searxng.searxng.svc:8080/healthz
                    icon: di:searxng

          - type: split-column
            widgets:
              - type: monitor
                title: DNS
                cache: 1m
                sites:
                  - title: Pi-hole
                    url: https://pihole.${DOMAIN}/admin
                    # / answers 404; /admin/ settles on 200 at /admin/login.
                    check-url: https://pihole-vip.lan-services.svc/admin/
                    allow-insecure: true
                    icon: di:pi-hole

              - type: monitor
                title: Network
                cache: 1m
                sites:
                  - title: Router
                    url: https://hubble.${DOMAIN}
                    check-url: http://hubble.lan-services.svc/
                    icon: mdi:router-network

                  - title: Traefik
                    url: https://traefik.${DOMAIN}/dashboard/
                    # A request with no matching Host rule ends at 404, which still
                    # proves Traefik routes. See docs/design/glance.md.
                    check-url: https://traefik.traefik.svc/
                    allow-insecure: true
                    alt-status-codes: [404]
                    icon: di:traefik

          - type: split-column
            widgets:
              - type: monitor
                title: Hypervisors
                cache: 1m
                # Self-signed certificates on every node, the same ones that make
                # the lan-insecure ServersTransport necessary.
                sites:
                  - title: rumba
                    url: https://rumba.${DOMAIN}
                    check-url: https://rumba.lan-services.svc:8006/
                    allow-insecure: true
                    icon: di:proxmox

                  - title: salsa
                    url: https://salsa.${DOMAIN}
                    check-url: https://salsa.lan-services.svc:8006/
                    allow-insecure: true
                    icon: di:proxmox

                  - title: samba
                    url: https://samba.${DOMAIN}
                    check-url: https://samba.lan-services.svc:8006/
                    allow-insecure: true
                    icon: di:proxmox

                  - title: tango
                    url: https://tango.${DOMAIN}
                    check-url: https://tango.lan-services.svc:8006/
                    allow-insecure: true
                    icon: di:proxmox

              - type: monitor
                title: Storage
                cache: 1m
                sites:
                  - title: Longhorn
                    url: https://longhorn.${DOMAIN}
                    check-url: http://longhorn-frontend.longhorn-system.svc/
                    icon: di:longhorn

                  - title: TrueNAS
                    url: https://voyager.${DOMAIN}
                    # / redirects to /ui/; probing it directly skips the hop.
                    check-url: https://voyager.lan-services.svc/ui/
                    allow-insecure: true
                    icon: di:truenas

      - size: small
        widgets:
          # The Prometheus widgets live in their own ConfigMap, unsubstituted.
          # The doubled sigil is Flux's escape: Glance receives a single one.
          - $$include: stats.yml

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
