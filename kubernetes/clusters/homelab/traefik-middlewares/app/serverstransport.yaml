# Lets a route reach a LAN backend serving a self-signed certificate that
# Traefik would otherwise refuse to connect to — currently Proxmox, TrueNAS
# and Pi-hole (kubernetes/lan-services/). This is a ServersTransport, not a
# Middleware — "custom middleware for the self-signed cert" is the intuition
# most people arrive with, and it is the wrong CR: a Middleware acts on the
# request/response passing through a router, while trusting (or not
# trusting) a backend's certificate is negotiated before any request is
# proxied, which is a transport concern. insecureSkipVerify applies only to
# the Traefik→backend leg; the browser→Traefik leg is untouched and still
# terminates on the wildcard certificate from TLSStore/default, so nothing
# user-facing is weakened.
#
# The two CRs are also referenced differently, which is easy to get wrong:
# an IngressRoute's service entry in another namespace names this via a
# single provider-qualified string, `traefik-lan-insecure@kubernetescrd`
# (namespace + name, no separate field), whereas a Middleware cross-namespace
# reference is a structured `name`/`namespace` field pair with no `@` suffix.
# Cross-namespace works here at all because the chart values set
# providers.kubernetesCRD.allowCrossNamespace: true.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: lan-insecure
spec:
  insecureSkipVerify: true
