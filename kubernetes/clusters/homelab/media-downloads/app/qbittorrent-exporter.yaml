# qBittorrent metrics for the Alloy annotation path, the same shape as the
# exportarr Deployments in the media layer (docs/design/arr-metrics.md). It
# authenticates with qBittorrent's API key, not the Web UI password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
  labels:
    app.kubernetes.io/name: qbittorrent-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/martabal/qbittorrent-exporter:v2.0.4
          env:
            - name: QBITTORRENT_BASE_URL
              value: http://qbittorrent.media-downloads.svc.cluster.local:8080
            - name: QBITTORRENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-exporter
                  key: QBITTORRENT_API_KEY
            # Tracker series label each tracker's URL, which for a private
            # tracker embeds the account's passkey.
            - name: ENABLE_TRACKER
              value: "false"
          ports:
            - name: metrics
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
