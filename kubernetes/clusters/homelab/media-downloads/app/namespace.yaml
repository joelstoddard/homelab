# PodSecurity privileged, and only the media-egress init containers need it:
# the nft write, the policy routes and the TUN device all want NET_ADMIN, which
# baseline forbids. The SOCKS5 proxy beside them holds no capability.
#
# This namespace exists for that single requirement. It is why the *arr
# applications stay in `media` at baseline instead of being dragged up here to
# satisfy one init container (docs/design/media-foundation.md, "Two namespaces").
apiVersion: v1
kind: Namespace
metadata:
  name: media-downloads
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
