# Third release of the Alloy chart (the others: alloy, alloy-events). Version
# pinned alongside kubernetes/alloy/app/alloy/helmrelease.yaml — bump all
# three together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-gateway
spec:
  interval: 1h0m0s
  releaseName: alloy-gateway
  timeout: 10m0s
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-gateway-values
  # The chart hard-codes a 1 s readiness timeout; a busy Alloy answers /-/ready
  # slower than that and sits NotReady, dropping the pod from the syslog
  # Service's endpoints and losing UDP syslog with no counter to notice it by.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: alloy-gateway
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 5
