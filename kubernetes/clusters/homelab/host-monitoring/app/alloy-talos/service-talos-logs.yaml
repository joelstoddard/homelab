# The address the talos role's node patch sends machine and kernel logs to
# (talos_logging_port). Shares the pinned ingest address via the sharing key.
apiVersion: v1
kind: Service
metadata:
  name: talos-logs
  annotations:
    lbipam.cilium.io/ips: "${INGEST_LB_IP}"
    lbipam.cilium.io/sharing-key: ingest
spec:
  type: LoadBalancer
  # Only the nodes may send: Cilium checks these ranges before its SNAT hides
  # the client, and a missing key denies everyone. docs/design/observability.md.
  loadBalancerSourceRanges: ${TALOS_NODE_SOURCE_RANGES:=[127.0.0.1/32]}
  # A NodePort would skip the source ranges.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-talos
  ports:
    - name: talos-logs
      port: 5170
      targetPort: 5170
      protocol: TCP
