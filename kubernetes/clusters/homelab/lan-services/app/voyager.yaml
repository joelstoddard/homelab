# TrueNAS SCALE's UI, on 443 with the self-signed certificate it ships;
# redirects `/` to `/ui/`.
apiVersion: v1
kind: Service
metadata:
  name: voyager
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: voyager
  labels:
    kubernetes.io/service-name: voyager
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - ${VOYAGER_IP}
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: voyager
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`voyager.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: voyager
          port: 443
          scheme: https
          serversTransport: traefik-lan-insecure@kubernetescrd
