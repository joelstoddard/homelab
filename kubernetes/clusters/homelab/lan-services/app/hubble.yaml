# The router: plain HTTP on 80, no TLS at all. Traefik terminates the
# wildcard certificate and forwards this leg in cleartext over the LAN —
# strictly better than the browser leg being unencrypted, as it is today.
apiVersion: v1
kind: Service
metadata:
  name: hubble
spec:
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hubble
  labels:
    kubernetes.io/service-name: hubble
addressType: IPv4
ports:
  - name: http
    port: 80
endpoints:
  - addresses:
      - ${ROUTER_IP}
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hubble.${DOMAIN}`)
      middlewares:
        - name: hubble-headers
      services:
        - name: hubble
          port: 80
---
# The router's settings pages post into a hidden same-origin frame.
# X-Frame-Options DENY stops every change, so this route sends SAMEORIGIN.
# See docs/design/ingress-tls.md, "Off-cluster LAN backends".
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hubble-headers
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    customFrameOptionsValue: SAMEORIGIN
    stsIncludeSubdomains: true
    stsSeconds: 31536000
