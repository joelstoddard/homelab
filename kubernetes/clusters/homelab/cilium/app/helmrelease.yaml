# Same release name and namespace as the talos role's seed
# (`helm install cilium -n kube-system`), so helm-controller adopts that
# release on its first reconcile instead of failing on existing resources.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h0m0s
  releaseName: cilium
  # The agent and Envoy DaemonSets roll two nodes at a time; across 20 nodes
  # an upgrade takes ~13 min, so the 5 min default fails a healthy rollout.
  timeout: 20m0s
  chartRef:
    kind: OCIRepository
    name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
