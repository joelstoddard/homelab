# The tag must equal CILIUM_VERSION in repo-root versions.env (the talos role
# seeds from it) — `make -C kubernetes lint` refuses a mismatch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 1h0m0s
  url: oci://quay.io/cilium/charts/cilium
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "1.20.1"
