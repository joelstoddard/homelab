# Lidarr metrics for the Alloy annotation path. One exportarr process gathers
# exactly one application, so each of the four gets its own Deployment; the
# shape is otherwise identical. docs/design/arr-metrics.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr-exporter
  labels:
    app.kubernetes.io/name: lidarr-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9707"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: ["lidarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: http://lidarr.media.svc.cluster.local:8686
            # Validated against ^[a-zA-Z0-9]{20,32}$ at startup, so a malformed
            # key crash-loops the exporter rather than failing its first scrape.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-apikeys
                  key: LIDARR_API_KEY
          ports:
            - name: metrics
              containerPort: 9707
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
