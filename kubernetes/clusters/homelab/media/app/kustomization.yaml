apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - namespace.yaml
  - secret-jellyfin-exporter.sops.yaml
  - secret-arr-apikeys.sops.yaml
  - secret-exporter-apikeys.sops.yaml
  - pv-library.yaml
  - pvc-library.yaml
  - pvc-jellyfin-config.yaml
  - pvc-prowlarr-config.yaml
  - pvc-sonarr-config.yaml
  - pvc-radarr-config.yaml
  - pvc-lidarr-config.yaml
  - pvc-bazarr-config.yaml
  - pvc-seerr-config.yaml
  - pvc-sabnzbd-config.yaml
  - jellyfin.yaml
  - jellyfin-exporter.yaml
  - prowlarr.yaml
  - prowlarr-exporter.yaml
  - flaresolverr.yaml
  - sonarr.yaml
  - sonarr-exporter.yaml
  - radarr.yaml
  - radarr-exporter.yaml
  - lidarr.yaml
  - lidarr-exporter.yaml
  - bazarr.yaml
  - bazarr-exporter.yaml
  - seerr.yaml
  - sabnzbd.yaml
  - sabnzbd-exporter.yaml
  - recyclarr.yaml
# Recyclarr's config, hashed so an edit rolls the next job. Substitution is
# disabled: the file is embedded verbatim and envsubst would eat its `$schema`.
configMapGenerator:
  - name: recyclarr-config
    files:
      - config/recyclarr.yml
generatorOptions:
  labels:
    kustomize.toolkit.fluxcd.io/substitute: disabled
