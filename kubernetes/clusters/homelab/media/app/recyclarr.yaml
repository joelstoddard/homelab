# Recyclarr: a server that syncs the TRaSH guide into Sonarr and Radarr on its
# own schedule (config/settings.yml). No Service or route; see
# docs/design/recyclarr.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7983"
    spec:
      # v9 needs SSE4.2 and POPCNT, which every amd64 node here has.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:9.0.0
          env:
            - name: TZ
              value: Europe/London
            - name: RECYCLARR_STATE_DIR
              value: /state
            - name: RECYCLARR_DATA_DIR
              value: /data
            # Nothing calls the API; the server refuses to start without a key.
            - name: RECYCLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recyclarr-api
                  key: RECYCLARR_API_KEY
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-apikeys
                  key: SONARR_API_KEY
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-apikeys
                  key: RADARR_API_KEY
          ports:
            - name: management
              containerPort: 7983
          # The server opens no port until the first guide download finishes.
          startupProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config/configs/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
            - name: config
              mountPath: /config/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: state
              mountPath: /state
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: recyclarr-config
        - name: state
          persistentVolumeClaim:
            claimName: recyclarr-state
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
