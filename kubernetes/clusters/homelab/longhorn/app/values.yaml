# Non-default Longhorn values only; the reasoning is docs/design/longhorn.md.
# Images stay on the chart's multi-arch tags — never pin a digest here, the
# fleet is amd64 + arm64.
# preUpgradeChecker.jobEnabled stays at the chart default: Longhorn's Flux
# install guide sets nothing there — only the Argo CD guide disables the
# hook job.
persistence:
  # The only StorageClass in the cluster; three replicas on three machines.
  defaultClass: true
  defaultClassReplicaCount: 3
  # Keep one replica on the node the pod runs on when it has a disk: local
  # reads. Writes still sync to all three.
  defaultDataLocality: best-effort
defaultSettings:
  # Default data path on every worker's EPHEMERAL partition (bind-mounted
  # into the kubelet by the machine config). Control planes host nothing:
  # Longhorn tolerates no control-plane taint.
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 3
  # topology.kubernetes.io/zone is the physical host (machine config), so
  # hard zone anti-affinity = no two replicas on one machine.
  replicaZoneSoftAntiAffinity: false
  # A stateful pod on a dead node is force-deleted so it can fail over,
  # instead of sitting Terminating until the node returns.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Without this a trim only reclaims the volume head, and a rebuild snapshot
  # pins the whole high-water mark forever (docs/design/longhorn.md).
  removeSnapshotsDuringFilesystemTrim: true
  # Requests, not limits, and only to escape BestEffort: Talos's OOM controller
  # kills the besteffort cgroup first, and killing these breaks storage on the
  # node (docs/design/longhorn.md "Why these pods carry requests").
  systemManagedCSIComponentsResourceLimits: >-
    {"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"32Mi"}},
     "node-driver-registrar":{"requests":{"cpu":"10m","memory":"24Mi"}},
     "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"}},
     "csi-attacher":{"requests":{"cpu":"10m","memory":"24Mi"}},
     "csi-provisioner":{"requests":{"cpu":"10m","memory":"24Mi"}},
     "csi-resizer":{"requests":{"cpu":"10m","memory":"24Mi"}},
     "csi-snapshotter":{"requests":{"cpu":"10m","memory":"24Mi"}}}
longhornManager:
  # Measured p95 is 198 MiB and 56 m across the fleet; the request rounds up.
  # No memory limit: a limit would have the kernel kill the node's Longhorn
  # control plane exactly when the node is busiest.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
ingress:
  # The UI behind Traefik. This chart emits a plain Ingress rather than an
  # IngressRoute, which is why traefik keeps its kubernetesIngress provider on.
  enabled: true
  ingressClassName: traefik
  host: longhorn.${DOMAIN}
  # tls stays at the chart default (false): with no spec.tls, Traefik serves
  # this route from the TLSStore default wildcard, so there is no per-service
  # secret to name. The router annotations are what put the route on the HTTPS
  # entrypoint at all. Longhorn's UI has no authentication of its own, so
  # its own basic-auth credential here is load-bearing, not decoration.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-default-headers@kubernetescrd,traefik-longhorn-auth@kubernetescrd
