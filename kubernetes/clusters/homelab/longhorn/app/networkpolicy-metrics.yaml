# Longhorn's own NetworkPolicy admits only Longhorn pods to longhorn-manager;
# this admits the alloy-cluster scraper to :9500/metrics as well (Cilium
# policies add up). docs/design/observability.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-metrics
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            app.kubernetes.io/instance: alloy-cluster
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
