# No auth Middleware: Sure has its own login (docs/design/ingress-tls.md).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sure
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sure.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: sure
          port: 3000
