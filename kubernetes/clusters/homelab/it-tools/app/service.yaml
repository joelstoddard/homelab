apiVersion: v1
kind: Service
metadata:
  name: it-tools
  labels:
    app.kubernetes.io/name: it-tools
spec:
  selector:
    app.kubernetes.io/name: it-tools
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: network-utils
  labels:
    app.kubernetes.io/name: network-utils
spec:
  selector:
    app.kubernetes.io/name: network-utils
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: htmltopdf
  labels:
    app.kubernetes.io/name: htmltopdf
spec:
  selector:
    app.kubernetes.io/name: htmltopdf
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cors-anywhere
  labels:
    app.kubernetes.io/name: cors-anywhere
spec:
  selector:
    app.kubernetes.io/name: cors-anywhere
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-udp-bridge
