# IT-Tools and its companion helpers — docs/design/it-tools.md.
#
# dependsOn traefik AND traefik-middlewares: the route references
# default-headers and it-tools-auth, and Traefik refuses a router whose
# middleware is missing. dependsOn cluster-secrets for DOMAIN and VOYAGER_IP.
#
# No decryption block: this layer carries no *.sops.yaml. The basic-auth
# credential lives in the traefik layer beside the other per-service ones.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: it-tools
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/homelab/it-tools/app
  prune: true
  dependsOn:
    - name: traefik
    - name: traefik-middlewares
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
