# changedetection.io, price and stock watching — docs/design/changedetection.md.
# No decryption: its credential lives in traefik; the ntfy URL is UI state.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: changedetection
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/homelab/changedetection/app
  prune: true
  dependsOn:
    - name: traefik
    - name: traefik-middlewares
    - name: longhorn
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
