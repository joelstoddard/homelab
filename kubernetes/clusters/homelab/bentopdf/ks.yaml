# Traefik refuses a router whose Middleware is missing, so this waits for
# both traefik layers; no decryption, as the credential lives in traefik.
# See docs/design/bentopdf.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bentopdf
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/homelab/bentopdf/app
  prune: true
  dependsOn:
    - name: traefik
    - name: traefik-middlewares
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
