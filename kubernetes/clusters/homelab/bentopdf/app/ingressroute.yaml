# BentoPDF has no login of its own, so its one route carries its own
# basic-auth Middleware (docs/design/ingress-tls.md).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bentopdf
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`bentopdf.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: bentopdf-auth
          namespace: traefik
      services:
        - name: bentopdf
          port: 8080
