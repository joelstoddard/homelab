# The image ships no USER and would run as root; it runs as 1000 on a
# read-only root, writing only /app/data (the volume) and /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 1
  # One RWO volume and one SQLite writer: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      # Service links would inject UPTIME_KUMA_PORT=tcp://..., which the app reads
      # as its own port setting (docs/design/uptime-kuma.md, Traps).
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Preferred, not required: the Pis hold the cluster's spare memory.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma:2.5.11
          env:
            # Skips the first-visit "SQLite or MariaDB" page.
            - name: UPTIME_KUMA_DB_TYPE
              value: sqlite
          ports:
            - name: http
              containerPort: 3001
          # 200 before and after setup; "/" redirects to the setup page.
          # Migrations run before the server listens; the startup probe gives
          # a slow one on a Pi up to 5 minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /api/entry-page
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/entry-page
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/entry-page
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
        - name: tmp
          emptyDir: {}
