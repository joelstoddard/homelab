# Uptime Kuma, the status page — docs/design/uptime-kuma.md.
#
# dependsOn longhorn for the data volume, traefik and traefik-middlewares for
# the route and its default-headers Middleware, cluster-secrets for DOMAIN.
# No decryption block: this layer carries no *.sops.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/homelab/uptime-kuma/app
  prune: true
  dependsOn:
    - name: traefik
    - name: traefik-middlewares
    - name: longhorn
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
