# No auth Middleware: ntfy enforces its own users and ACLs, and the phone app
# cannot answer a basic-auth prompt in front of them.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ntfy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ntfy.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: ntfy
          port: 80
