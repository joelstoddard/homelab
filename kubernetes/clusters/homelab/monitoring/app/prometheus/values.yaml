# Prometheus as a TSDB only: Alloy scrapes and remote-writes into it, so the
# chart's own scrape jobs are all off and the receiver flag is on.
# docs/design/observability.md.
server:
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver
  # 14d binds first; the size limit is only the safety net that keeps the
  # volume from filling. Change all three together: docs/design/observability.md.
  retention: 14d
  retentionSize: 22GB
  persistentVolume:
    enabled: true
    size: 25Gi
  # RWO Longhorn volume: the old pod must release it before the new one mounts.
  strategy:
    type: Recreate
  # WAL replay after a restart takes minutes at 690k series and answers no
  # probe meanwhile; without this the liveness probe killed Prometheus at 75 s
  # and it never came back. 90 x 10 s = 15 min before liveness takes over.
  startupProbe:
    enabled: true
    periodSeconds: 10
    failureThreshold: 90
    timeoutSeconds: 10
  # The startup probe only guards until it first succeeds. After that, Alloy
  # flushing a backlog blocks the HTTP handler for minutes, and the stock
  # 3 x 15 s liveness killed Prometheus mid-catch-up on 2026-09-18.
  livenessProbePeriodSeconds: 30
  livenessProbeTimeout: 15
  livenessProbeFailureThreshold: 15
  # Longhorn from a VM is ~2x the IOPS of a Pi; the TSDB write path notices.
  nodeSelector:
    kubernetes.io/arch: amd64
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
  # Sized against 157k active series (2026-10-24): steady RSS ~650 MiB, Go heap
  # <= 800 MiB under query load. Requests are honest rather than minimal,
  # because the scheduler places on them.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    # Replay peaks above steady state, so 2Gi OOM-killed it mid-replay and it
    # never finished; 1 CPU throttled it below answering a trivial query.
    limits:
      cpu: "2"
      memory: 3Gi
# The chart's default jobs are a map, so each must be switched off by name.
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
alertmanager:
  enabled: false
# Node metrics come from Alloy's unix exporter (one DaemonSet, not two).
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
# Subchart. Its Service carries prometheus.io/scrape by default
# (prometheusScrape: true), which is how Alloy finds it.
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # gotk_resource_info, one series per Flux object with its Ready status, for
  # infra-flux-not-ready: a failed Flux reconcile requeues without returning an
  # error, so controller_runtime_reconcile_errors_total never moves. Shape from
  # fluxcd/flux2-monitoring-example, trimmed to the kinds this cluster uses.
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - helmrepositories
          - ocirepositories
          - kustomizations
          - helmreleases
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
