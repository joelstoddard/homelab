# One ConfigMap per rule group plus the notification policy, labelled for
# Grafana's alerts sidecar. Substitution is disabled: the annotations are Go
# templates full of {{ $labels.x }}, which Flux's envsubst would blank.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret-contact-point.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_alert: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: alerting-rules-monitoring
    files: [rules-monitoring.yaml]
  - name: alerting-rules-kubernetes
    files: [rules-kubernetes.yaml]
  - name: alerting-rules-nodes
    files: [rules-nodes.yaml]
  - name: alerting-rules-storage
    files: [rules-storage.yaml]
  - name: alerting-rules-services
    files: [rules-services.yaml]
  - name: alerting-policy
    files: [policy.yaml]
