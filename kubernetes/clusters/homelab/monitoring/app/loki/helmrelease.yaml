# The chart version is pinned here only. grafana-community chart versions
# carry no v prefix. A bump is a Loki upgrade: read the chart's upgrade notes
# (schema and deploymentMode renames have both happened) and run the
# multi-arch image check in docs/design/longhorn.md first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h0m0s
  releaseName: loki
  timeout: 10m0s
  chart:
    spec:
      chart: loki
      version: "18.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
