# Grafana's built-in admin login. The only credential in this layer: Grafana
# authenticates itself, so its Ingress carries no basic-auth middleware.
# substitute: disabled — this layer runs envsubst after decryption, and a
# password containing $ would be rewritten (the htpasswd $apr1$ lesson).
