# Every Kustomization emits "Reconciliation finished" every interval, change or
# not; only events that changed something or failed become annotations.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: grafana-changes
spec:
  providerRef:
    name: grafana
  eventSeverity: info
  exclusionList:
    - "^Reconciliation finished in "
    - "^Dependencies do not meet ready condition"
    - "^Health check passed in "
  eventSources:
    - {kind: Kustomization, name: "*", namespace: flux-system}
    - {kind: HelmRelease, name: "*", namespace: alloy}
    - {kind: HelmRelease, name: "*", namespace: cert-manager}
    - {kind: HelmRelease, name: "*", namespace: descheduler}
    - {kind: HelmRelease, name: "*", namespace: host-monitoring}
    - {kind: HelmRelease, name: "*", namespace: kube-system}
    - {kind: HelmRelease, name: "*", namespace: longhorn-system}
    - {kind: HelmRelease, name: "*", namespace: monitoring}
    - {kind: HelmRelease, name: "*", namespace: traefik}
