# One ConfigMap per dashboard, labelled for Grafana's sidecar, folder from the
# annotation. Substitution is disabled on every ConfigMap here: dashboard JSON
# is full of $__rate_interval and ${var}, which Flux's envsubst would eat.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: dashboard-k8s-views-global
    files: [Kubernetes/vendored/k8s-views-global.json]
    options: {annotations: {grafana_folder: Kubernetes/vendored}}
  - name: dashboard-kubernetes-overview
    files: [Kubernetes/overview.json]
    options: {annotations: {grafana_folder: Kubernetes}}
  - name: dashboard-namespaces
    files: [Kubernetes/namespaces.json]
    options: {annotations: {grafana_folder: Kubernetes}}
  - name: dashboard-k8s-views-nodes
    files: [Kubernetes/vendored/k8s-views-nodes.json]
    options: {annotations: {grafana_folder: Kubernetes/vendored}}
  - name: dashboard-nodes
    files: [Kubernetes/nodes.json]
    options: {annotations: {grafana_folder: Kubernetes}}
  - name: dashboard-pods
    files: [Kubernetes/pods.json]
    options: {annotations: {grafana_folder: Kubernetes}}
  - name: dashboard-node-exporter-full
    files: [Kubernetes/vendored/node-exporter-full.json]
    options: {annotations: {grafana_folder: Kubernetes/vendored}}
  - name: dashboard-longhorn
