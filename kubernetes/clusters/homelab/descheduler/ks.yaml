# Descheduler: evicts crash-looping pods and collects Failed ones
# (docs/design/descheduler.md). dependsOn cilium so its first pod gets pod
# networking; no substitution and no decryption, it carries neither.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/homelab/descheduler/app
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
