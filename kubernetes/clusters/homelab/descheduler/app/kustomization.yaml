apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: descheduler
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
# Unhashed so the HelmRelease can name it; the watch label reconciles the
# release on a content change (same pattern as longhorn/app).
configMapGenerator:
  - name: descheduler-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
