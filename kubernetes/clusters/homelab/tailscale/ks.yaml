# The Tailscale subnet router / exit node (docs/design/tailscale-router.md).
# No dependsOn: it needs a CNI like every pod, nothing Cilium-specific. The
# auth Secret is SOPS-encrypted, hence the decryption block.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/tailscale/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
