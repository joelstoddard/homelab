apiVersion: v1
kind: Service
metadata:
  name: spliit
  labels:
    app.kubernetes.io/name: spliit
spec:
  selector:
    app.kubernetes.io/name: spliit
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
