# The pod holds the Pi-hole admin password, so it may reach only cluster DNS
# the two instances and Uptime Kuma's push endpoint. toServices resolves the selectorless lan-services
# Services to their EndpointSlice addresses, so no LAN address is written here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nebula-sync-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nebula-sync
  enableDefaultDeny:
    egress: true
    ingress: false
  egress:
    # By endpoint, not by Service CIDR: per-packet LB translates the Service
    # address before policy sees it (docs/design/cilium-per-packet-lb.md).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toServices:
        - k8sService:
            serviceName: pihole-01
            namespace: lan-services
        - k8sService:
            serviceName: pihole-02
            namespace: lan-services
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The push container's heartbeat to Uptime Kuma.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            app.kubernetes.io/name: uptime-kuma
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
