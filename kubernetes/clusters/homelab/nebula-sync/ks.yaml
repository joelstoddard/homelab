# nebula-sync copies the Pi-hole pair's lists, groups and clients one way,
# pihole-01 to pihole-02 — docs/design/dns-chain.md, "Lists and their sync".
#
# dependsOn lan-services for the pihole-01 and pihole-02 Services it names,
# and cilium for the egress policy's CRD. No postBuild: nothing here is
# substituted, so the $(PIHOLE_PASSWORD) references in the CronJob reach the
# kubelet intact.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nebula-sync
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/nebula-sync/app
  prune: true
  dependsOn:
    - name: cilium
    - name: lan-services
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
