# One unprivileged Alloy scraping every target that is not tied to a node:
# annotated pods and Services, the control plane, Longhorn, SearXNG, Home
# Assistant and the descheduler. Config is config/cluster.alloy, mounted from the
# alloy-cluster-config ConfigMap. docs/design/observability.md.
alloy:
  configMap:
    create: false
    name: alloy-cluster-config
    key: cluster.alloy
  # Holds every cluster-wide series in its remote-write WAL, which grows for
  # as long as Prometheus is down.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
# Replaces the chart's default rules, which read every Secret in the cluster:
# discovery, the control plane's /metrics, and one named Secret, which
# remote.kubernetes.secret only ever GETs.
rbac:
  rules:
    - apiGroups: [""]
      resources: ["nodes", "pods", "services", "endpoints"]
      verbs: ["get", "list", "watch"]
  clusterRules:
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: alloy-cluster
      namespace: flux-system
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["cluster-secrets"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: alloy-cluster
      namespace: flux-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: alloy-cluster
    subjects:
      - kind: ServiceAccount
        name: alloy-cluster
        namespace: alloy
controller:
  type: deployment
  replicas: 1
  # A surge pod would scrape every target alongside the old one until it is
  # Ready; a gap of a minute is the accepted cost instead.
  updateStrategy:
    type: Recreate
  # Preferred, not required: the scheduler sees only each VM's allocatable,
  # not the overcommitted NUC under it, but a VM beats going unschedulable.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["arm64"]
  # This one replica owns every cluster-wide job, and the default 300 s
  # toleration would leave them absent for ~6 min after a node dies.
  tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "12345"
# No Service: its scrape goes to the pod, and `alloy-cluster` is the name a
# clustered `alloy` release gives its peer Service.
service:
  enabled: false
