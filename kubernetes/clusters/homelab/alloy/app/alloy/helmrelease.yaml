# The chart version is pinned here only (no v prefix; the app version has
# one). A bump moves the Alloy and config-reloader images: run the multi-arch
# check in docs/design/longhorn.md first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy
spec:
  interval: 1h0m0s
  releaseName: alloy
  # The DaemonSet rolls one node at a time, ~35 s each: 20 nodes need ~12 min.
  timeout: 20m0s
  chart:
    spec:
      chart: alloy
      version: "1.16.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
  # The chart hard-codes a 1 s readiness timeout; a busy Alloy answers /-/ready
  # slower than that and sits NotReady for days while still shipping data.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: alloy
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 5
