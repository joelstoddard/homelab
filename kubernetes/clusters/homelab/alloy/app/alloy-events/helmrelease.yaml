# Second release of the same chart: loki.source.kubernetes_events cannot be
# sharded across the DaemonSet (every member would emit every event), so it
# runs once, here. Version pinned in versions.env as ALLOY_CHART_VERSION; `make lint` checks.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events
  namespace: alloy
spec:
  interval: 1h0m0s
  releaseName: alloy-events
  timeout: 10m0s
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-events-values
  # The chart hard-codes a 1 s readiness timeout, which a busy Alloy misses.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: alloy-events
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 5
