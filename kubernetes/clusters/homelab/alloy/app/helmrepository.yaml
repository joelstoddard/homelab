# The Alloy chart stayed in grafana/helm-charts when Loki and Grafana moved to
# grafana-community (kubernetes/clusters/homelab/monitoring/app/helmrepositories.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: alloy
spec:
  interval: 1h0m0s
  url: https://grafana.github.io/helm-charts
