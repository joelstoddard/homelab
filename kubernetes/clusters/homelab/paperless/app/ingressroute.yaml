# No auth Middleware: Paperless has its own login, and its API serves the phone
# apps with tokens (docs/design/ingress-tls.md).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paperless.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: paperless
          port: 8000
