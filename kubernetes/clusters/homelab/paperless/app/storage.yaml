# Search index, classification model and the SQLite database: Longhorn, never
# NFS, which corrupts SQLite (docs/design/paperless.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  labels:
    app.kubernetes.io/name: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# The documents: Voyager's own paperless dataset and export (Mapall user
# paperless), following media-library's volume and mount options.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-documents
  labels:
    app.kubernetes.io/name: paperless
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
    - noatime
    - nodiratime
  nfs:
    server: ${VOYAGER_IP}
    path: /mnt/Voyager/paperless
  claimRef:
    name: paperless-documents
    namespace: paperless
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-documents
  labels:
    app.kubernetes.io/name: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-documents
  resources:
    requests:
      storage: 100Gi
