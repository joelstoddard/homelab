# Longhorn's recurring jobs, split from longhorn/ for the reason
# traefik-middlewares is split from traefik: the RecurringJob CRD ships inside
# the chart, so a CR of that kind cannot be in the same apply pass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-jobs
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/longhorn-jobs/app
  prune: true
  dependsOn:
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: flux-system
