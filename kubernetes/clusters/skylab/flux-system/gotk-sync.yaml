# Hand-written; same shape `flux bootstrap` would generate. The Kustomization
# reconciles ./kubernetes/clusters/skylab, which includes this directory —
# from the first reconcile on, Flux manages itself. Public repo: no secretRef
# on the source. sops-age holds the skylab key only
# (docs/design/skylab-flux.md, "Decryption: the skylab key").
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/joelstoddard/homelab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/clusters/skylab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
