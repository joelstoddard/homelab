apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - ocirepository.yaml
  - helmrelease.yaml
# values.yaml is shared with the talos role's one-shot seed; the watch label
# makes helm-controller reconcile on content changes (as the home cilium/app).
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
