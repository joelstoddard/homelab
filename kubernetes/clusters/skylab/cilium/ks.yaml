# Cilium is seeded by the talos role before Flux exists; this Kustomization
# adopts the release. Pruning this layer removes the CNI
# (docs/design/cilium-bootstrap.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/skylab/cilium/app
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
