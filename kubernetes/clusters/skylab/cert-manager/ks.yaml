# cert-manager: the chart and its CRDs, for Forgejo's certificate alone
# (docs/design/skylab-flux.md). Split from the issuers because a
# ClusterIssuer cannot be applied until its CRD is Established; wait: true
# guarantees that for the dependent layer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/skylab/cert-manager/app
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
