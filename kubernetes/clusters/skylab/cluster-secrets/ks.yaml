# Skylab's substitution inputs, and nothing of the home Secret's: no LAN
# fact reaches a public cluster (docs/design/skylab-flux.md). The Secret lives
# in flux-system because substituteFrom resolves Secrets in the consuming
# Kustomization's own namespace; wait: true so a consumer's dependsOn means
# the keys are there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/skylab/cluster-secrets/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
