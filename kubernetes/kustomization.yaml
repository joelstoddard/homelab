# Entry point of the flux-system Kustomization (spec.path ./kubernetes).
# Every top-level directory Flux reconciles is listed here; flux-system/
# first so Flux manages its own controllers and sync objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - cilium
  - cilium-lb
  - cluster-secrets
  - cert-manager
  - cert-manager-issuers
  - traefik
  - traefik-middlewares
  - lan-services
  - tailscale
  - longhorn
  - monitoring
  - alloy
