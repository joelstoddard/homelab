# LB-IPAM pool + L2 announcement policy. `dependsOn: cilium` (wait: true
# there) means the Cilium CRDs are registered and the agents Ready before
# this applies. The pool CR is SOPS-encrypted (its spec is LAN addresses, kept
# out of a public repo), hence the decryption block.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/cilium-lb/app
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
