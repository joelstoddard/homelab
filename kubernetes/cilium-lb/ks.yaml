# LB-IPAM pool + L2 announcement policy. `dependsOn: cilium` (wait: true
# there) means the Cilium CRDs are registered and the agents Ready before
# this applies. The pool bounds are LAN addresses, so they come from the
# SOPS-encrypted Secret cilium-lb-vars via postBuild substitution instead of
# sitting in plaintext in a public repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/cilium-lb/app
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cilium-lb-vars
