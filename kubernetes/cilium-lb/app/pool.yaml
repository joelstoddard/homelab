# One pool, every Service of type LoadBalancer draws from it (no
# serviceSelector). Bounds are the NetBox IP range reserved for it, injected
# by the cilium-lb Kustomization from Secret cilium-lb-vars.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: ${LB_POOL_START}
      stop: ${LB_POOL_STOP}
