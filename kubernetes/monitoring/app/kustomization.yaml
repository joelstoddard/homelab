apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - helmrepositories.yaml
  - prometheus/helmrelease.yaml
  - loki/helmrelease.yaml
  - grafana/helmrelease.yaml
  - secret-grafana-admin.sops.yaml
  - dashboards
# Each chart's values.yaml -> the ConfigMap its HelmRelease reads via
# valuesFrom; no hash suffix so the HelmRelease can name it, and the watch
# label makes helm-controller reconcile on content changes (same pattern as
# longhorn/app). These three files are substituted by Flux, so ${DOMAIN} is
# the only $ allowed in them, comments included — docs/design/observability.md.
configMapGenerator:
  - name: prometheus-values
    files:
      - values.yaml=prometheus/values.yaml
  - name: loki-values
    files:
      - values.yaml=loki/values.yaml
  - name: grafana-values
    files:
      - values.yaml=grafana/values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
