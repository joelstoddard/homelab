# One Loki, filesystem storage on a Longhorn PVC. The scalable modes need an
# object store this cluster does not have; Longhorn's three replicas are the
# durability story. docs/design/observability.md.
deploymentMode: Monolithic
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
  nodeSelector:
    kubernetes.io/arch: amd64
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
# deploymentMode alone does not zero the scalable-mode components in this
# chart: their defaults stay at 3 and validate.yaml refuses a Monolithic
# release with any of them above zero. Keep these at 0 when bumping.
write:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0
loki:
  # Single tenant, LAN only, no gateway in front: nothing sets X-Scope-OrgID.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ingester:
    chunk_encoding: snappy
# Alloy pushes to and Grafana queries loki:3100 directly.
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
# Both are memcached deployments whose default allocations are gigabytes;
# a single-node homelab Loki does not need a cache tier.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
