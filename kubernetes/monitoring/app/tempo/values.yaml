# One Tempo, local trace storage on a Longhorn PVC, same shape as Loki:
# Longhorn's three replicas are the durability story and no object store
# exists. Beyla sends OTLP straight here. docs/design/tracing.md.
replicas: 1
tempo:
  reportingEnabled: false
  retention: 72h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Helm deep-merges this map, so each Jaeger protocol is nulled explicitly
  # (`jaeger: null` alone breaks the chart's ports template); the chart still
  # declares Jaeger containerPorts but nothing listens on them.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    jaeger:
      protocols:
        grpc: null
        thrift_binary: null
        thrift_compact: null
        thrift_http: null
  # The service map: Beyla's application_service_graph feature only records
  # inside its span-metrics path (OBI pkg/export/prom), so Tempo derives the
  # traces_service_graph_* series from the sampled traces and remote-writes
  # them to Prometheus; span-metrics stay off to spare the series budget.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.monitoring.svc/api/v1/write
    # The chart's default is /tmp/tempo; the WAL belongs on the PVC.
    storage:
      path: /var/tempo/metrics
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
persistence:
  enabled: true
  size: 10Gi
# Longhorn from a VM is ~2x the IOPS of a Pi.
nodeSelector:
  kubernetes.io/arch: amd64
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3200"
