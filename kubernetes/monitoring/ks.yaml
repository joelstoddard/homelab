# Observability backends: Prometheus (TSDB + remote-write receiver), Loki and
# Grafana — docs/design/observability.md. dependsOn longhorn for the two PVCs,
# cilium so the pods get networking on first reconcile, cluster-secrets for
# ${DOMAIN} in Grafana's Ingress and root_url, traefik-middlewares because that
# Ingress names default-headers and Traefik refuses a router whose middleware is
# missing. wait: true holds the alloy and host-monitoring layers until the
# remote-write and push endpoints exist; 15 m covers three charts and two PVCs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/monitoring/app
  prune: true
  wait: true
  timeout: 15m0s
  dependsOn:
    - name: cilium
    - name: longhorn
    - name: cluster-secrets
    - name: traefik-middlewares
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
