apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicy-metrics.yaml
# values.yaml -> the ConfigMap the HelmRelease reads via valuesFrom. No hash
# suffix so the HelmRelease can name it; the watch label makes helm-controller
# reconcile on content changes (same pattern as cilium/app).
configMapGenerator:
  - name: longhorn-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
