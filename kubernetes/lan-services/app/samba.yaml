# Proxmox VE's UI, on 8006 with the self-signed certificate every node ships.
apiVersion: v1
kind: Service
metadata:
  name: samba
spec:
  clusterIP: None
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: samba
  labels:
    kubernetes.io/service-name: samba
addressType: IPv4
ports:
  - name: https
    port: 8006
endpoints:
  - addresses:
      - ${SAMBA_IP}
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: samba
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`samba.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: samba
          port: 8006
          scheme: https
          serversTransport: traefik-lan-insecure@kubernetescrd
