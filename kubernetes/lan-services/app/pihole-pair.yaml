# The two instances of the DNS chain's Pi-hole pair, each by its own address,
# never the VIP. No IngressRoute: the names exist for in-cluster clients,
# nebula-sync first, which must reach each instance rather than whichever holds
# the VIP.
apiVersion: v1
kind: Service
metadata:
  name: pihole-01
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-01
  labels:
    kubernetes.io/service-name: pihole-01
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - ${PIHOLE_01_IP}
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-02
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-02
  labels:
    kubernetes.io/service-name: pihole-02
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - ${PIHOLE_02_IP}
    conditions:
      ready: true
