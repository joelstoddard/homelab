# The old single Pi-hole, by name for pihole-exporter and the blackbox probe.
# The admin UI route is the pair's, in pihole-pair.yaml.
apiVersion: v1
kind: Service
metadata:
  name: pihole
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole
  labels:
    kubernetes.io/service-name: pihole
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - ${PIHOLE_IP}
    conditions:
      ready: true
