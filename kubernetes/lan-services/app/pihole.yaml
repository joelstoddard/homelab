# Pi-hole's admin UI, on 443 with the self-signed certificate it ships;
# `/` returns 403 because the UI lives at /admin, not because of anything
# Traefik does. Pi-hole also answers on 80, unused here.
apiVersion: v1
kind: Service
metadata:
  name: pihole
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole
  labels:
    kubernetes.io/service-name: pihole
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - ${PIHOLE_IP}
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pihole.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: pihole
          port: 443
          scheme: https
          serversTransport: traefik-lan-insecure@kubernetescrd
