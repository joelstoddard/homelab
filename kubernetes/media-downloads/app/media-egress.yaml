# This namespace's VPN egress: a Tailscale tunnel, an nftables kill switch and
# a SOCKS5 listener, with no application of its own. A workload opts in with
# the egress.homelab/via: media-egress label, not by living in this pod.
#
# See docs/design/media-egress.md, "The VPN boundary" and "Egress by label".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-egress
  labels:
    app.kubernetes.io/name: media-egress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-egress
      # The tunnel's metrics port: tailscaled serves no other Prometheus
      # endpoint, and a pod carries one scrape annotation.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
    spec:
      serviceAccountName: media-egress
      # amd64 only: wireguard-go encrypts in userspace, and the arm64 Pis are
      # slow at it.
      nodeSelector:
        kubernetes.io/arch: amd64
      # Three init containers, in order: kill switch, ip rules, then
      # tailscale as a native sidecar. See docs/design/media-egress.md,
      # "The VPN boundary".
      initContainers:
        - name: killswitch
          # Distroless, purely for `nft`; it ships no shell, so the ruleset is
          # a file. See docs/design/media-egress.md, "Inside the ruleset".
          image: registry.k8s.io/build-image/distroless-iptables:v0.9.7
          command: ["/usr/sbin/nft", "-f", "/etc/killswitch/ruleset.nft"]
          # Capabilities are per container, not per pod. Root as well, because
          # netlink refuses the write without it.
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: killswitch
              mountPath: /etc/killswitch
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # Filtering is not routing: the kill switch decides what may leave,
        # these rules decide which way (docs/design/media-egress.md, "Traps").
        - name: iprules
          image: ghcr.io/tailscale/tailscale:v1.102.3
          # pref 5100 must stay below tailscaled's 5270 and outside the 52xx
          # range it reconciles. No dollar sign anywhere in this script: the
          # manifest is substituted, and envsubst would blank one.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ip rule del to 10.244.0.0/16 lookup main pref 5100 2>/dev/null || true
              ip rule add to 10.244.0.0/16 lookup main pref 5100
              ip rule del to 10.96.0.0/12 lookup main pref 5100 2>/dev/null || true
              ip rule add to 10.96.0.0/12 lookup main pref 5100
              ip rule del to 10.0.0.0/20 lookup main pref 5100 2>/dev/null || true
              ip rule add to 10.0.0.0/20 lookup main pref 5100
              ip rule list
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.3
          # restartPolicy Always makes this a native sidecar: the kubelet
          # holds gost back until this container's startupProbe passes.
          restartPolicy: Always
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: media-egress
            # Its own state Secret, never the router's: two nodes on one key
            # overwrite each other and burn a Mullvad device slot per restart.
            - name: TS_KUBE_SECRET
              value: media-egress-tailscale-state
            - name: TS_AUTH_ONCE
              value: "true"
            # Kernel mode: a tailscale0 interface in this shared netns
            # is what lets gost, not tailscaled, serve a full SOCKS5 proxy —
            # BIND included.
            - name: TS_USERSPACE
              value: "false"
            # A tailnet DNS config pushed alongside an exit node rewrites
            # /etc/resolv.conf, and this pod must resolve cluster names.
            - name: TS_ACCEPT_DNS
              value: "false"
            # Auto-detection picks legacy iptables, whose `filter` table the
            # Talos kernel does not expose (docs/design/tailscale-router.md).
            # Inert in userspace mode, which programs no firewall rules at
            # all; kept so kernel mode doesn't regress this if it ever returns.
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            # TS_AUTH_ONCE applies these at first enrolment only. A hostname
            # exit node needs a netmap, so the postStart hook sets it instead
            # (docs/design/media-egress.md, "Choosing the exit node").
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:media-downloads
            # /healthz and /metrics on TS_LOCAL_ADDR_PORT (default [::]:9002).
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_ENABLE_METRICS
              value: "true"
          ports:
            - name: metrics
              containerPort: 9002
          # The exit node, re-asserted on every start so a recreated state
          # Secret cannot leave the pod on a bare tailnet
          # (docs/design/media-egress.md, "Choosing the exit node").
          #
          # 300s matches the startupProbe below and must not be shorter: a
          # postStart hook gates the container reaching Running, so a smaller
          # bound would silently pre-empt that probe.
          #
          # No dollar sign in this script, so `timeout` around `until` rather
          # than a counter: envsubst would blank a shell variable.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    timeout 300 sh -c 'until tailscale set --exit-node=de-dus-wg-101.mullvad.ts.net; do sleep 5; done'
          # The gate on the whole pod: spec.containers (gost) wait for a
          # tailnet IP. Five minutes, because first authentication is slower
          # than a reconnect.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          # A wedged tailscaled restarts rather than leaving a tunnel that is
          # up in name only; the kill switch makes the gap dead air, not a leak.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          # Withdraws the media-egress-socks5 endpoint, not a restart target: /healthz
          # only proves a tailnet address, but a lost exit node lets a
          # proxied dial go out as a direct system dial, with no route to
          # catch it (docs/design/media-egress.md, "The VPN boundary").
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale status --json | tr -d ' \n' | grep -qE '"ExitNodeStatus":\{"ID":"[^"]*","Online":true'
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # Programs routes into tailscale0: gost shares this
          # netns and needs a real interface to dial through.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # The subnet router's figures, and a floor: wireguard-go encrypts
            # in userspace, so throttling delays /healthz into a restart.
            limits:
              cpu: "1"
              memory: 256Mi
      containers:
        - name: gost
          image: gogost/gost:v3.3.0
          # Both bind and udp default off in gost; bind is what libtorrent's
          # SOCKS5 session needs to complete, udp is what uTP and DHT need —
          # trimming either silently reintroduces the bug this replaces.
          args:
            - -L
            - socks5://:1055?bind=true&udp=true
          # Non-root is load-bearing, not hygiene: the kill switch's last
          # accept is `meta skuid 0`, so a root proxy would bypass it —
          # uid 1000 is what makes the ruleset actually govern this traffic.
          securityContext:
            runAsUser: 1000
          ports:
            - name: socks5
              containerPort: 1055
          readinessProbe:
            tcpSocket:
              port: socks5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        # Generated with a name hash, so editing the ruleset rolls the pod
        # instead of leaving the old rules in a netns nobody restarts.
        - name: killswitch
          configMap:
            name: media-egress-killswitch
---
# Named for the function, not the host. Workloads outside this pod reach the
# exit node through here; kubernetes/media-egress/ decides which ones may.
apiVersion: v1
kind: Service
metadata:
  name: media-egress-socks5
  labels:
    app.kubernetes.io/name: media-egress-socks5
spec:
  selector:
    app.kubernetes.io/name: media-egress
  ports:
    - name: socks5
      port: 1055
      targetPort: 1055
