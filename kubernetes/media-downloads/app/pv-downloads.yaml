# The downloads tree on voyager — the subdirectory, never the export root.
# That is what structurally stops the torrent client reaching the library: it
# is not in its mount namespace at all, rather than being forbidden by policy.
#
# Mounted at /media/downloads, which is byte-identical to the path the *arr
# applications see through their own root mount. Same paths everywhere means no
# "Remote Path Mapping" in any application (docs/design/arr-stack.md).
#
# Mount options are byte-identical to media-library's for a harder reason than
# tidiness. Several are superblock properties shared per client, server and
# export, so two mounts with differing options do not make two policies —
# whichever pod lands on the node first sets policy for both.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-downloads
  labels:
    app.kubernetes.io/name: media-downloads
spec:
  capacity:
    # NFS enforces no quota from here, so this number is documentation.
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  # Retain, so pruning this layer never proposes deleting in-flight downloads.
  persistentVolumeReclaimPolicy: Retain
  # Empty, not absent: an absent class means "use the default", which would
  # hand this volume to Longhorn.
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
    - noatime
    - nodiratime
  nfs:
    server: ${VOYAGER_IP}
    path: /mnt/Voyager/public/downloads
  # Pre-bound, so no other claim in the cluster can take the volume.
  claimRef:
    name: media-downloads
    namespace: media-downloads
