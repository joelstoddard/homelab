apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-egress
---
# containerboot keeps this node's key in the media-egress-tailscale-state Secret:
# create it once, then read and patch it. That Secret is not in git, so Flux
# never prunes it and a rescheduled pod is the same tailnet node.
#
# The name differs from the subnet router's tailscale-state deliberately. Two
# tailnet nodes sharing one state Secret would overwrite each other's key and
# burn a second Mullvad device slot on every reschedule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-egress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["media-egress-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-egress
subjects:
  - kind: ServiceAccount
    name: media-egress
roleRef:
  kind: Role
  name: media-egress
  apiGroup: rbac.authorization.k8s.io
