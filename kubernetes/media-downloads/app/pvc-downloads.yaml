# volumeName and the empty storageClassName bind this to the media-downloads
# PersistentVolume. Without them the default StorageClass would provision an
# empty Longhorn volume instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-downloads
  labels:
    app.kubernetes.io/name: media-downloads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: media-downloads
  resources:
    requests:
      storage: 4Ti
