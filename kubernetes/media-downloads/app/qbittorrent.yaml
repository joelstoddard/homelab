# qBittorrent and a Tailscale sidecar in one pod. They share a network
# namespace, which is the whole mechanism: the client inherits tailscaled's
# default route and has no other way out (docs/design/arr-stack.md).
#
# One replica with strategy Recreate. The config claim is ReadWriteOnce and
# qBittorrent writes resume data continuously, so a second pod either deadlocks
# on the volume or corrupts that state.
#
# SHIPPED AT ZERO: the three egress tests have not run against a live pod.
# Scale to 1 only after they pass — docs/design/arr-stack.md, "Bring-up".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
      # The sidecar's :9002/metrics, for the alloy layer. qBittorrent itself
      # serves no Prometheus endpoint, and a pod carries one scrape annotation.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
    spec:
      serviceAccountName: qbittorrent
      # Following Jellyfin, Loki and Tempo: the Pis' USB-backed Longhorn
      # replicas are slow under the constant small writes a torrent client
      # makes to its resume data.
      nodeSelector:
        kubernetes.io/arch: amd64
      # Two init containers, in this order, and the order is the fail-closed
      # design. The kill switch runs to completion first, so the netns is
      # already drop-by-default before anything that could leak exists.
      #
      # tailscaled follows as a native sidecar — an init container with
      # restartPolicy Always. The kubelet holds spec.containers until its
      # startupProbe passes and terminates it last, which closes the window
      # where qBittorrent resumes torrents while the tunnel is still coming up.
      initContainers:
        - name: killswitch
          # Distroless, purely for `nft`: the tailscale image ships only the
          # iptables compatibility binaries, and a rule in the shared `filter`
          # table would sit in the same table tailscaled manages. No shell in
          # this image, so the ruleset is a file rather than a command line.
          image: registry.k8s.io/build-image/distroless-iptables:v0.9.7
          command: ["/usr/sbin/nft", "-f", "/etc/killswitch/ruleset.nft"]
          # The rules outlive this container because they live in the pod's
          # network namespace, which the pause container holds open. They are
          # not in tailscaled's route table 52 either, so its reconciler never
          # touches them and a dead or restarting daemon blackholes egress.
          #
          # Capabilities are per container, not per pod: this one carries its
          # own NET_ADMIN, and root because netlink refuses the write without
          # it (the namespace is PodSecurity privileged for exactly this).
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: killswitch
              mountPath: /etc/killswitch
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # No sysctl init container, unlike kubernetes/tailscale/: that one
        # needs ip_forward because it routes the LAN for other machines. This
        # node is an exit-node client and forwards nothing.
        #
        # No /dev/net/tun mount either. containerboot mknods the device itself
        # when it is absent, which is how the subnet router already runs on
        # this cluster — a hostPath CharDevice would be the fallback if that
        # ever stops working.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.3
          # What makes this a native sidecar rather than a second init step:
          # the kubelet keeps it running alongside spec.containers and stops it
          # after them.
          restartPolicy: Always
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: qbittorrent
            # Its own state Secret, never the router's: two nodes on one key
            # overwrite each other and burn a Mullvad device slot per restart.
            - name: TS_KUBE_SECRET
              value: qbittorrent-tailscale-state
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_USERSPACE
              value: "false"
            # containerboot already defaults to false; stated because the
            # default changing would be invisible and expensive. A tailnet DNS
            # config pushed alongside an exit node rewrites /etc/resolv.conf,
            # and this pod must keep resolving cluster names.
            - name: TS_ACCEPT_DNS
              value: "false"
            # Auto-detection picks legacy iptables, whose `filter` table the
            # Talos kernel does not expose, so tailscaled's rules silently fail
            # to install. nf_tables is there; use it.
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            # TS_AUTH_ONCE means these flags apply at first enrolment only, so
            # a later edit here changes nothing on an enrolled pod.
            #
            # The pinned node, and the return-path trap that arrives with it:
            # docs/design/arr-stack.md, "Choosing the exit node" and "Traps".
            - name: TS_EXTRA_ARGS
              value: >-
                --advertise-tags=tag:media-downloads
                --exit-node=de-dus-wg-101.mullvad.ts.net
            # /healthz and /metrics on TS_LOCAL_ADDR_PORT (default [::]:9002).
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_ENABLE_METRICS
              value: "true"
          ports:
            - name: metrics
              containerPort: 9002
          # This is the gate on the whole pod: spec.containers do not start
          # until /healthz answers 200, which it does once the node has a
          # tailnet IP. Five minutes of budget, because a first authentication
          # against the control plane is slower than a reconnect.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          # A wedged tailscaled restarts rather than leaving a tunnel that is
          # up in name only. The restart is safe to take now: the kill switch
          # is in the netns, so the gap is dead air rather than a leak.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # The subnet router's figures, and they are a floor rather than a
            # guess: wireguard-go encrypts in userspace, so throughput is
            # CPU-bound and a throttled container delays the /healthz handler
            # into a liveness restart.
            limits:
              cpu: "1"
              memory: 256Mi
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls476
          env:
            # The LinuxServer image starts as root and drops to these through
            # s6-overlay, which is why this namespace cannot be "restricted".
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          # Every timeoutSeconds is explicit: the 1 s default is not enough for
          # an application checking its resume data over NFS, which is the
          # mistake Jellyfin's probes shipped with (docs/design/jellyfin.md).
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            # /media/downloads, matching byte for byte what the *arr
            # applications see through their own root mount. That identity is
            # what removes every Remote Path Mapping.
            - name: downloads
              mountPath: /media/downloads
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # Both halves on every container, never BestEffort: Talos's OOM
            # controller kills BestEffort first, and that is how a memory spike
            # once wedged a node's Longhorn transport.
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        # Generated with a name hash, so editing the ruleset rolls the pod
        # instead of leaving the old rules in a netns nobody restarts.
        - name: killswitch
          configMap:
            name: qbittorrent-killswitch
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# No Certificate and no tls.secretName: TLSStore/default serves the wildcard
# and Pi-hole's address wildcard already resolves the name, so a new service
# needs one route and nothing else (docs/design/ingress-tls.md).
#
# qbittorrent-auth is this service's own Middleware and credential, following
# dashboard-auth, longhorn-auth and glance-auth. One per service, never shared:
# a leak from one would otherwise expose the rest.
#
# First-run trap, unrelated to Traefik: qBittorrent validates the Host header
# and answers a proxied hostname with 401 until the domain is whitelisted in
# its WebUI settings. It is written at runtime into the config volume, so it is
# a bring-up step rather than a manifest.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`qbittorrent.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: qbittorrent-auth
          namespace: traefik
      services:
        - name: qbittorrent
          port: 8080
