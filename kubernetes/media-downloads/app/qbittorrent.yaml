# An ordinary workload: no sidecars, no NET_ADMIN, no tunnel of its own. The
# egress.homelab/via: media-egress label enforces rather than routes — it denies this pod
# every path to the internet except the media-egress Deployment's SOCKS5 listener, and
# qBittorrent must still be pointed at that proxy in its own settings or it
# reaches nothing at all. See docs/design/media-egress.md, "Egress by label".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        egress.homelab/via: media-egress
    spec:
      # Named rather than omitted: a defaulted field keeps whatever value is
      # already on the object even after it's dropped from the manifest, so
      # writing `default` explicitly is what guarantees it.
      serviceAccountName: default
      # amd64 only, following Jellyfin: the Pis' USB-backed Longhorn replicas
      # are slow under this client's constant small writes.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls476
          env:
            # The LinuxServer image starts as root and drops to these through
            # s6-overlay, which is why this namespace cannot be "restricted".
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          # Every timeoutSeconds is explicit: the 1 s default is not enough for
          # an application checking resume data over NFS
          # (docs/design/jellyfin.md).
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            # Byte for byte what the *arr applications see through their own
            # root mount, which is what removes every Remote Path Mapping.
            - name: downloads
              mountPath: /media/downloads
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # Never BestEffort: Talos's OOM controller kills BestEffort first,
            # and that once wedged a node's Longhorn transport.
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
---
# qBittorrent's front door.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# One route and nothing else: TLSStore/default serves the wildcard and Pi-hole
# already resolves the name (docs/design/ingress-tls.md). No auth middleware —
# the Web UI has its own login (docs/design/media-foundation.md, "Ingress and auth").
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`qbittorrent.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: qbittorrent
          port: 8080
