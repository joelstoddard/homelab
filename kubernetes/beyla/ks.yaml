# eBPF auto-instrumentation: RED metrics and traces for every containerised
# service outside kube-system, with no code changes — docs/design/tracing.md.
# dependsOn monitoring (wait: true there) so Prometheus and Tempo exist
# before Beyla starts exporting. No postBuild: nothing here names the
# domain. No wait: nothing depends on this layer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beyla
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/beyla/app
  prune: true
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
