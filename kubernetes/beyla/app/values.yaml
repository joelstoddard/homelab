# Beyla on every worker: instruments every containerised process except
# kube-system and the collectors, exports RED metrics for Alloy to scrape
# and OTLP traces straight to Tempo. Privileged + hostPID are the chart's
# defaults and what Talos needs (perf_event_paranoid=3); contextPropagation
# below is what adds hostNetwork. docs/design/tracing.md.
preset: application
privileged: true
# Control-plane VMs have ~2 GB free and run nothing Beyla would instrument.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
# A pod takes minutes to die, so one node at a time would roll 14 nodes for
# the better part of an hour; a node without Beyla only misses RED samples.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 50%
# Steady state is ~360 MiB a node; analysing a large Go binary (Grafana,
# Prometheus) spikes past 512Mi and OOMKilled the pod on those nodes.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
# The metadata cache exists for clusters far larger than 20 nodes.
k8sCache:
  replicas: 0
# hostNetwork, the /sys/fs/cgroup and /sys/kernel/tracing mounts and the
# node-port :9090 all come from this chart default; pin it so nothing
# upstream can flip it silently.
contextPropagation:
  enabled: true
config:
  data:
    attributes:
      kubernetes:
        enable: true
      # Per-pod attributes would churn a series set on every restart; identity
      # stays at namespace/deployment/node. Applies to metrics only — spans
      # keep k8s.pod.name for the Loki jump.
      select:
        "*":
          exclude:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
    # The chart's default filter is for the network feature, which is off.
    filter: null
    discovery:
      instrument:
        - k8s_namespace: "*"
          containers_only: true
      # The chart's default list also excludes monitoring and cert-manager;
      # this one keeps only kube-system and the collectors out.
      exclude_instrument:
        - k8s_namespace: "{kube-system,kube-node-lease,alloy,beyla}"
        - exe_path: "{*beyla,*alloy,*ebpf-instrument,*obi,*otelcol,*otelcol-contrib}"
      default_exclude_instrument: []
    routes:
      unmatched: heuristic
    ebpf:
      # W3C traceparent injection; needs kernel lockdown "none", which Talos has.
      context_propagation: headers
    # No application_service_graph: OBI only records it inside the span-metrics
    # path, so it is inert on its own; Tempo's metrics-generator draws the map.
    prometheus_export:
      port: 9090
      path: /metrics
      features:
        - application
    otel_traces_export:
      endpoint: http://tempo.monitoring.svc:4317
      protocol: grpc
      # 20 Alloys pushing to Loki would otherwise flood Tempo with push spans.
      sampler:
        name: traceidratio
        arg: "0.1"
