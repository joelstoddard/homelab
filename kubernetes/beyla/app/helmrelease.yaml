# The chart version is pinned here only (no v prefix; the app version has
# none either). A bump moves the Beyla image: run the multi-arch check in
# docs/design/longhorn.md first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beyla
spec:
  interval: 1h0m0s
  releaseName: beyla
  # A Beyla pod takes minutes to die (the runtime's kill times out while it
  # detaches its probes), so a 14-node rollout outlives 10m and Helm's
  # rollback then hits the same wall. Budget for the whole roll.
  timeout: 30m0s
  chart:
    spec:
      chart: beyla
      version: "1.16.11"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: beyla-values
