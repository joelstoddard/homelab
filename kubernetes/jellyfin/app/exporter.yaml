# Session and transcode metrics, polled from Jellyfin's REST API. Jellyfin's own
# EnableMetrics endpoint carries .NET runtime counters and nothing about
# playback, so it stays off (docs/design/jellyfin.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-exporter
  labels:
    app.kubernetes.io/name: jellyfin-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-exporter
      # Unauthenticated metrics, so the annotation path carries this one —
      # unlike SearXNG, whose endpoint needs credentials Alloy can only pass
      # from an explicit scrape block.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9594"
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/rebelcore/jellyfin-exporter:v1.5.2
          # Only media, playing, system and users run by default. Transcoding
          # carries the stream detail this exists for, and tasks shows whether
          # a library scan is running.
          args:
            - --collector.transcoding
            - --collector.tasks
          env:
            - name: JELLYFIN_ADDRESS
              value: http://jellyfin.jellyfin.svc.cluster.local:8096
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-exporter
                  key: JELLYFIN_TOKEN
          ports:
            - name: metrics
              containerPort: 9594
          # A tcpSocket probe, because every GET of /metrics makes the exporter
          # poll Jellyfin.
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
