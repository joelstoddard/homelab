# No Certificate and no tls.secretName: TLSStore/default serves the wildcard, so
# a new hostname needs one route and nothing else, and Pi-hole's address=/<domain>/
# already resolves it (docs/design/ingress-tls.md).
#
# No auth middleware, deliberately: Jellyfin has its own login, and a basic-auth
# prompt breaks every native client, which cannot answer one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin.${DOMAIN}`)
      middlewares:
        - name: default-headers
          namespace: traefik
      services:
        - name: jellyfin
          port: 8096
