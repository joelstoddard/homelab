# A top-level namespace is safe here: both Middlewares are namespaced. The
# sibling cert-manager-issuers layer sets none because kustomize would stamp
# it onto its cluster-scoped ClusterIssuers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
resources:
  - middlewares.yaml
  - serverstransport.yaml
