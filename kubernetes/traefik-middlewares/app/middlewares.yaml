# Shared middlewares, reached from other namespaces by their qualified name
# traefik-<name>@kubernetescrd. Two different paths get there: an Ingress
# annotated traefik.ingress.kubernetes.io/router.middlewares names that
# qualified form directly, which the kubernetesIngress provider resolves with
# nothing else enabled (Longhorn's route, the only consumer today); a Traefik
# CR in another namespace referencing these by name + namespace goes through
# the kubernetesCRD provider, and that is what
# providers.kubernetesCRD.allowCrossNamespace in the chart values permits.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    stsIncludeSubdomains: true
    stsSeconds: 31536000
---
# Basic auth for services with no authentication of their own. One middleware
# and one Secret PER SERVICE, deliberately: a shared credential means a leak
# from either exposes both, and neither can be rotated without disrupting the
# other. They are not equivalent risks — the Traefik dashboard is read-only,
# while Longhorn's UI can delete volumes — so they do not share a secret.
#
# Both Secrets live in the traefik layer, which runs Flux variable
# substitution: envsubst replaces a classic $apr1$… hash with an empty string,
# so every htpasswd line here must be bcrypt (htpasswd -nB).
#
# This is a stopgap for single-operator access, not an auth system. Per-service
# passwords stop reuse; they do not give per-user identity, revocation or MFA.
# That needs forward-auth against an IdP — see the Kanidm entry in TODO.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
spec:
  basicAuth:
    secret: dashboard-auth-users
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-auth
spec:
  basicAuth:
    secret: longhorn-auth-users
