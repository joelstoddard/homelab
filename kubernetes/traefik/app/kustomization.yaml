apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - certificate.yaml
  # The Middlewares are a layer of their own (their CRD arrives with the chart
  # in this same pass); the Secret one of them names stays here, in the
  # namespace that reads it.
  - secret-basic-auth.sops.yaml
configMapGenerator:
  - name: traefik-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
