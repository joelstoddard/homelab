apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - certificate.yaml
  # The Middlewares are a layer of their own (their CRD arrives with the chart
  # in this same pass); the Secrets they name stay here, in the namespace that
  # reads them. One per service, never shared — middlewares.yaml explains why.
  - secret-dashboard-auth.sops.yaml
  - secret-longhorn-auth.sops.yaml
configMapGenerator:
  - name: traefik-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
