apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik
    namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: 29.0.1
  values:
    globalArguments:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=INFO"
      - "--providers.kubernetesingress.ingressendpoint.publishedservice=traefik/traefik"

    deployment:
      kind: DaemonSet
      enabled: true
      replicas: 3
      annotations: {}
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    ports:
      web:
        redirectTo:
          port: websecure
      websecure:
        tls:
          enabled: true

    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host('traefik.jstlabs.xyz')
        entryPoints: ["websecure"]
        middlewares:
          - name: traefik-dashboard-basicauth
            namespace: traefik
        services:
          - name: api@internal
            kind: TraefikService

    providers:
      kubernetesCRD:
        enabled: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: false

    rbac:
      enabled: true

    service:
      enabled: true
      type: LoadBalancer
      annotations: {}
      labels: {}
      spec:
        loadBalancerIP: 192.168.1.122
      loadBalancerSourceRanges: []
      externalIPs: []

  interval: 1m0s
