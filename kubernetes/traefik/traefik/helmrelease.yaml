apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik-release
    namespace: traefik
spec:
    chart:
        spec:
            chart: traefik
            reconcileStrategy: ChartVersion
            sourceRef:
                kind: HelmRepository
                name: traefik-repo
            version: 29.0.0
    values:
        globalArguments:
            - --global.sendanonymoususage=false
            - --global.checknewversion=false
        additionalArguments:
            - --serversTransport.insecureSkipVerify=true
            - --log.level=INFO
        deployment:
            kind: DaemonSet
            enabled: true
            replicas: 3
            annotations: {}
            podAnnotations: {}
            additionalContainers: []
            initContainers: []
        ports:
            web:
                redirectTo:
                    port: websecure
            websecure:
                tls:
                    enabled: true
        ingressRoute:
            dashboard:
                enabled: true
                matchRule: Host('traefik.example.com')
                entryPoints:
                    - websecure
                middlewares:
                    - name: traefik-dashboard-basicauth
        providers:
            kubernetesCRD:
                enabled: true
                ingressClass: traefik
                allowExternalNameServices: true
            kubernetesIngress:
                enabled: true
                allowExternalNameServices: true
                publishedService:
                    enabled: false
        rbac:
            enabled: true
        service:
            enabled: true
            type: LoadBalancer
            annotations: {}
            labels: {}
            spec:
                loadBalancerIP: 192.168.1.122
            loadBalancerSourceRanges: []
            externalIPs: []
        extraObjects:
            - apiVersion: v1
              kind: Secret
              metadata:
                name: traefik-dashboard-auth-secret
              type: kubernetes.io/basic-auth
              stringData:
                username: ENC[AES256_GCM,data:vn0Ykw==,iv:jMVPkKiad+audEGnZqUEaF9/itfyrQ6NHvkwN1ZhFkk=,tag:WIgrQGoT/GHPolQdGvC5/Q==,type:str]
                password: ENC[AES256_GCM,data:mQ3DZpyHm+lR/MO5NzAu,iv:JdNbrv5hRYQZVra6zBCotSjDctCZxZmPA+/dnujMSao=,tag:bR3GSw2yk2f44vdsJ4dgqw==,type:str]
            - apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: traefik-dashboard-basicauth
              spec:
                basicAuth:
                    secret: traefik-dashboard-auth-secret
    interval: 1m0s
