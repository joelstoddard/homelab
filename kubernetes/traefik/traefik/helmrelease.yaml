---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: 29.0.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 15m

  # dependsOn:
  #   - name: cert-manager
  #     namespace: cert-manager

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    globalArguments:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=INFO"

    deployment:
      kind: Deployment
      enabled: true
      replicas: 3
      annotations: {}
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    ports:
      web:
        redirectTo:
          port: websecure
          priority: 10
      websecure:
        http3:
          enabled: true
        advertisedPort: 4443
        tls:
          enabled: true

    image:
      registry: docker.io
      repository: traefik
      pullPolicy: IfNotPresent

    ingressRoute:
      dashboard:
        enabled: false

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: true

    rbac:
      enabled: true

    service:
      enabled: true
      type: LoadBalancer
      annotations: {}
      labels: {}
      spec:
        loadBalancerIP: "192.168.1.123"
        externalTrafficPolicy: local
      loadBalancerSourceRanges: []
      externalIPs: []

    # resources:
    #   requests:
    #     memory: 100Mi
    #     cpu: 100m
