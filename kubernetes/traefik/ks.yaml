# Traefik: the cluster's ingress. dependsOn cert-manager-issuers so the
# ClusterIssuer the wildcard Certificate names already exists, cilium-lb so
# the LB-IPAM pool the Service draws from is applied, and cluster-secrets for
# the two substituted variables — reached transitively through
# cert-manager-issuers today, named here so a change to that edge cannot
# silently break substitution. wait: true so a later layer can dependsOn
# traefik meaningfully. postBuild for ${DOMAIN} and ${TRAEFIK_LB_IP};
# decryption for the basic-auth Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/traefik/app
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: cert-manager-issuers
    - name: cilium-lb
    - name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
